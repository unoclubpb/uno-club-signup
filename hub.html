<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Uno Club Hub"><title>Uno Club Hub — Test</title><link rel="manifest" href="./hub.webmanifest?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="./uno-club-hub-new.svg?v=5"><link rel="icon" type="image/svg+xml" href="./uno-club-hub-new.svg?v=5">
<style>
*{box-sizing:border-box}html{background:#f5f6f8;height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;height:100%;max-height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:pan-x;color:#111;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:118px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0b0b0b;color:#fff;padding:13px max(16px,calc((100vw - 620px)/2 + 16px))}
header h1{margin:0;flex:1;text-align:center;font-size:clamp(26px,7vw,38px);font-weight:750;line-height:1.05;letter-spacing:-.8px}
.brand{flex:none;width:76px;height:76px;border:3px solid #2588f7;border-radius:14px;background:radial-gradient(circle at 50% 25%,#244a78,#050a13 70%);box-shadow:inset 0 0 12px #2076de,0 0 7px #2278e8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 3px #000;line-height:.85}
.brand .club{font-size:20px;color:#dceafa}.brand .uno{font-size:26px;font-weight:1000;letter-spacing:-1px}.brand .clubword{font-size:11px;font-weight:900;letter-spacing:2px;margin-top:3px}.brand .hubword{margin-top:5px;background:linear-gradient(#2484e7,#0c3877);border:1px solid #439cff;border-radius:3px;padding:3px 10px;font-size:10px;font-weight:900;letter-spacing:2px}
main{width:min(100%,620px);margin:0 auto;padding:18px 16px 36px;display:grid;gap:12px}
a.tile,button.tile{font-family:inherit;display:flex;width:100%;min-height:88px;align-items:center;gap:15px;text-decoration:none;text-align:left;padding:14px;background:#fff;border:1px solid #d4dce8;border-radius:12px;color:#172235;box-shadow:0 2px 4px rgba(16,40,75,.04);cursor:pointer}
.tile:not(:disabled){background:#1e5acb;color:#fff;border:2px solid #103c8b}.tile:not(:disabled) strong{color:#fff}.tile:not(:disabled) small{color:#e3edff}.tile:not(:disabled) .chev{color:#fff}
.tile .glyph{width:52px;height:52px;display:grid;place-items:center;flex:none;border-radius:10px;background:#e8f2ff;color:#1760be;font-size:28px}
.tile .info{min-width:0;flex:1}.tile strong{display:block;font-size:17px;font-weight:750}.tile small{display:block;font-size:12px;color:#69788a;margin-top:4px}.chev{font-size:30px;color:#4279bd;font-weight:300}
button.tile:disabled{background:#e7e9ed;color:#6c7480;cursor:not-allowed;border-color:#dadde1;box-shadow:none}
button.tile:disabled .glyph{background:#d9dde4;color:#8994a5}button.tile:disabled small{color:#87909b}
footer{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:96vw;text-align:center;bottom:calc(8px + env(safe-area-inset-bottom));font-size:.68rem;font-weight:400;color:#000;padding:0;margin:0;z-index:10;pointer-events:none}
@media(max-width:390px){header{height:118px}.brand{height:66px;width:66px}main{padding-top:14px}.tile{min-height:78px!important}}
#embeddedLists{position:fixed;inset:0;background:#f5f6f8;z-index:500;display:none;flex-direction:column}#embeddedLists.active{display:flex}#hubReturn,#shoppingReturn,#mealsReturn{width:100%;height:44px;flex:none;background:#0b0b0b;color:white;border:0;font-size:16px;font-weight:700;text-align:left;padding:0 18px}#listsFrame,#shoppingFrame,#mealsFrame{display:block;width:100%;flex:1;min-height:0;border:0;background:#f5f6f8}#embeddedShopping{position:fixed;inset:0;background:#f5f6f8;z-index:500;display:none;flex-direction:column}#embeddedShopping.active{display:flex}#embeddedMeals{position:fixed;inset:0;background:#f5f6f8;z-index:500;display:none;flex-direction:column}#embeddedMeals.active{display:flex}
</style></head>
<body><header><img src="./uno-club-hub-new.svg?v=5" alt="Uno Club Hub" style="width:68px;height:68px;border-radius:12px;object-fit:contain;flex:none"><h1>Uno Club Hub</h1><span aria-hidden="true" style="width:68px;flex:none"></span></header>
<main>
<button class="tile" type="button" onclick="openLists()" aria-label="Open List Sign-Up"><span class="glyph" aria-hidden="true">☷</span><span class="info"><strong>List Sign-Up</strong><small>Lists and sign-ups</small></span><span class="chev" aria-hidden="true">›</span></button>
<button class="tile" type="button" onclick="openShopping()" aria-label="Open Shopping"><span class="glyph" aria-hidden="true">🛒</span><span class="info"><strong>Shopping</strong><small>Shopping lists and stores</small></span><span class="chev" aria-hidden="true">›</span></button>
<button class="tile" type="button" onclick="openMeals()" aria-label="Open Meal Planning"><span class="glyph" aria-hidden="true">♨</span><span class="info"><strong>Meal Planning</strong><small>Plan meals, history, and ideas</small></span><span class="chev" aria-hidden="true">›</span></button>
<button class="tile" type="button" onclick="openStaff()" aria-label="Open Staff Management"><span class="glyph" aria-hidden="true"><svg viewBox="0 0 64 64" width="46" height="46" fill="none" stroke="#1760be" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="7"/><circle cx="13" cy="25" r="6"/><circle cx="51" cy="25" r="6"/><path d="M20 49v-6c0-8 5-13 12-13s12 5 12 13v6H20Z"/><path d="M15 37C8 37 5 42 5 49v5h12M49 37c7 0 10 5 10 12v5H47"/></svg></span><span class="info"><strong>Staff Management</strong><small>Staff scheduling, coverage, and history</small></span><span class="chev" aria-hidden="true">›</span></button>
<button class="tile" type="button" onclick="openTodo()" aria-label="Open To-Do List"><span class="glyph" aria-hidden="true"><svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#1760be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="36" height="38" rx="5"/><path d="m12 16 4 4 7-8M27 17h9M12 30l4 4 7-8M27 31h9"/></svg></span><span class="info"><strong>To-Do List</strong><small>Tasks, reminders, and completed items</small></span><span class="chev" aria-hidden="true">›</span></button>
<button class="tile" disabled><span class="glyph" aria-hidden="true">▣</span><span class="info"><strong>Tournament Remote</strong><small>Coming Soon</small></span><span aria-hidden="true">🔒</span></button>
<footer>uno club hub v.102926.040</footer>
</main><div id="embeddedLists"><iframe id="listsFrame" title="Uno Club Lists" loading="eager" src="about:blank"></iframe></div><div id="embeddedMeals"><iframe id="mealsFrame" title="Uno Club Meal Planning" loading="eager" src="about:blank"></iframe></div><div id="embeddedShopping"><iframe id="shoppingFrame" title="Uno Club Shopping" loading="eager" src="about:blank"></iframe></div><script>
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.source!==document.getElementById('listsFrame').contentWindow)return;if(event.data&&event.data.type==='UNO_HUB_CLOSE_LISTS')closeLists();});

const HUB_TEST_VERSION="102926.040";
let hubLastCheck=0,hubChecking=false;
function hubIsOnMain(){return !document.getElementById('embeddedLists').classList.contains('active')&&!document.getElementById('embeddedShopping').classList.contains('active')&&!document.getElementById('embeddedMeals').classList.contains('active');}
async function checkHubUpdates(force=false){
 if(!hubIsOnMain()||hubChecking||(!force&&Date.now()-hubLastCheck<30000))return;
 hubLastCheck=Date.now();hubChecking=true;
 try{
  const url=new URL('./hub.html',location.href);
  url.searchParams.set('update_check',String(Date.now()));
  const response=await fetch(url.href,{cache:'no-store'});
  if(!response.ok)return;
  const html=await response.text();
  const version=html.match(/uno club hub v\.([0-9.]+)/)?.[1];
  if(version&&version!==HUB_TEST_VERSION){
   const next=new URL(location.href);
   next.searchParams.set('v',version.replaceAll('.','-'));
   next.searchParams.set('refresh',String(Date.now()));
   location.replace(next.href);
  }
 }catch(error){/* Stay usable when offline. */}
 finally{hubChecking=false;}
}
window.addEventListener('pageshow',()=>checkHubUpdates());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkHubUpdates();});

function openListsSection(section){
 const frame=document.getElementById('listsFrame');
 const container=document.getElementById('embeddedLists');
 frame.style.visibility='hidden';
 frame.onload=()=>{frame.style.visibility='visible'};
 const params=new URLSearchParams({hub:'1',loaded:String(Date.now())});
 if(section==='staff'||section==='todo')params.set(section,'1');
 frame.setAttribute('src','./index.html?'+params.toString());
 container.classList.add('active');
}
function openTodo(){openListsSection('todo')}
function openStaff(){openListsSection('staff')}
function openLists(){openListsSection('lists')}
function closeLists(){
 const container=document.getElementById('embeddedLists');
 const frame=document.getElementById('listsFrame');
 container.classList.remove('active');
 frame.style.visibility='hidden';
 frame.onload=null;
 frame.setAttribute('src','about:blank');
 checkHubUpdates(true);
}
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.source!==document.getElementById('shoppingFrame').contentWindow)return;if(event.data&&event.data.type==='UNO_HUB_CLOSE_SHOPPING')closeShopping();});
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.source!==document.getElementById('mealsFrame').contentWindow)return;if(event.data&&event.data.type==='UNO_HUB_CLOSE_MEALS')closeMeals();});
function openMeals(){const frame=document.getElementById('mealsFrame');if(frame.getAttribute('src')==='about:blank')frame.setAttribute('src','./meals.html?hub=1&loaded='+Date.now());document.getElementById('embeddedMeals').classList.add('active');}
function closeMeals(){document.getElementById('embeddedMeals').classList.remove('active');checkHubUpdates(true);}
function openShopping(){const frame=document.getElementById('shoppingFrame');frame.setAttribute('src','https://unoclubpb.github.io/uno-club-shopping/?loaded='+Date.now());document.getElementById('embeddedShopping').classList.add('active');}
function closeShopping(){document.getElementById('embeddedShopping').classList.remove('active');checkHubUpdates(true);}
</script></body></html>
