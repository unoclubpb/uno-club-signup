<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Uno Club Meals</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:100px;background:#0b0b0b;color:#fff;display:flex;align-items:center;padding:12px;gap:8px}header h1{font-size:clamp(20px,5.5vw,28px);text-align:center;flex:1;margin:0}header img{width:62px;height:62px;object-fit:contain}button{font:inherit;cursor:pointer}header .back{border:0;background:transparent;color:#fff;font-size:38px;width:52px}main{max-width:620px;padding:12px 14px 18px;margin:auto}.buttons{display:grid;gap:11px}.nav{border:2px solid #103c8b;background:#1e5acb;color:#fff;border-radius:12px;min-height:88px;padding:14px;display:flex;align-items:center;gap:15px;text-align:left}.glyph{width:52px;height:52px;border-radius:10px;background:#e8f2ff;color:#1760be;display:grid;place-items:center;font-size:27px}.nav strong{flex:1;font-size:17px}.arrow{font-size:30px;font-weight:300}form{background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;display:grid;gap:10px}.field{display:grid;gap:4px;position:relative}.field label{font-size:14px;font-weight:700}.field input,.field textarea,.field select{width:100%;min-height:46px;border:1px solid #d0d0d0;border-radius:8px;padding:9px;font-size:16px;background:#fff;color:#111}.field textarea{min-height:80px}.dates{display:grid;grid-template-columns:1.35fr .75fr 1fr;gap:7px}.action{background:#21a447;color:#fff;border:2px solid #0d722f;border-radius:10px;min-height:50px;font-weight:800}.suggestions{display:none;background:#fff;border:1px solid #bbb;border-radius:8px;overflow:hidden;max-height:170px;overflow-y:auto}.suggestions button{display:block;width:100%;padding:10px;border:0;border-bottom:1px solid #eee;background:white;text-align:left;color:#111}.items{display:grid;gap:9px;margin-top:10px}.item{background:#fff;border:1px solid #d9d9d9;border-radius:10px;padding:13px;display:grid;gap:6px;text-align:left;width:100%;color:#111}.meta{font-size:13px;color:#555}.sides{font-size:14px;color:#333}.actions{display:flex;gap:8px;margin-top:5px}.actions button,.sort button{flex:1;border:1px solid #1450a5;color:#fff;background:#1e5acb;border-radius:8px;padding:9px;font-size:14px;font-weight:700}.actions .danger{flex:0 0 43px;background:#ac2830;border-color:#84131c}.sort{display:flex;gap:8px}.sort button{font-size:12px}.empty{padding:20px;text-align:center;background:#fff;border-radius:10px}.error{color:#bd2020;font-weight:700}footer{text-align:center;color:#243c66;font-size:12px;font-weight:700;padding:10px}@media(max-width:390px){.nav{min-height:84px}header{height:88px}}</style></head><body><div id="app"></div><script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const VERSION="102926.030";
const sb=createClient("https://dugemciflvwboiyneufa.supabase.co","sb_publishable_8Cj40yK0IGPrhBHVPn2SNQ__-B8RHBK");
const hub=new URLSearchParams(location.search).get("hub")==="1";
const app=document.getElementById("app");
let mode="menu",meals=[],ideas=[],editId=null,repeatId=null,ideaId=null,viewEntree="",historySort="date",historyAsc=false,error="";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title=v=>String(v||"").toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const key=v=>String(v||"").trim().toLowerCase();
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const dateText=v=>new Date(v+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const sideParts=v=>String(v||"").split(",").map(x=>x.trim()).filter(Boolean);
const entreeNames=()=>[...new Set(meals.map(x=>title(x.entree)).filter(Boolean))].sort();
async function loadData(){const [a,b]=await Promise.all([sb.from("club_meals").select("*").order("meal_date",{ascending:false}).order("id",{ascending:false}),sb.from("meal_ideas").select("*").order("created_at",{ascending:false})]);if(a.error||b.error){error="Unable to load meal data. Please try again.";}else{meals=a.data||[];ideas=b.data||[];error="";}}
function back(){if(mode==="menu"){if(hub&&parent!==window)parent.postMessage({type:"UNO_HUB_CLOSE_MEALS"},location.origin);else location.href="./hub.html";return}if(mode==="historyDetail"){mode="history";viewEntree=""}else if(mode==="plan"&&ideaId){mode="ideas";ideaId=null}else{mode="menu";editId=null;repeatId=null;ideaId=null;viewEntree=""}error="";render()}
function menu(){return '<div class="buttons">'+[["plan","Plan Meal","calendar"],["planned","Planned Meals","check"],["history","Meal History","clock"],["ideas","Meal Ideas","idea"]].map(([id,label,ic])=>'<button class="nav" data-go="'+id+'"><span class="glyph">'+({calendar:"▦",check:"✓",clock:"◷",idea:"✦"}[ic])+'</span><strong>'+label+'</strong><span class="arrow">›</span></button>').join("")+"</div>"}
function plan(){const row=meals.find(x=>String(x.id)===String(editId))||meals.find(x=>String(x.id)===String(repeatId))||ideas.find(x=>String(x.id)===String(ideaId));const d=editId&&row?row.meal_date:today();const sides=sideParts(row?.sides);const nowYear=new Date().getFullYear();const yrs=[...new Set([nowYear-1,nowYear,nowYear+1,Number(d.slice(0,4))])].sort();const sel=(id,opts,value)=>'<select id="'+id+'">'+opts.map(([v,label])=>'<option value="'+v+'" '+(String(v)===String(value)?"selected":"")+'>'+label+'</option>').join("")+"</select>";const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
return '<form id="mealForm"><div class="field"><label for="entree">Entrée</label><input id="entree" maxlength="100" autocomplete="off" value="'+esc(row?.entree||"")+'"><div id="entreeMatches" class="suggestions"></div><div id="servedInfo" class="meta"></div></div>'+
[0,1,2,3].map(i=>'<div class="field side"><label for="side'+i+'">Side '+(i+1)+'</label><input id="side'+i+'" class="sideInput" maxlength="100" autocomplete="off" placeholder="Optional" value="'+esc(sides[i]||"")+'"><div class="suggestions sideMatches"></div></div>').join("")+
'<div class="field"><label>Date of Planned Meal</label><div class="dates">'+sel("month",months.map((m,i)=>[i+1,m]),Number(d.slice(5,7)))+sel("day",Array.from({length:31},(_,i)=>[i+1,i+1]),Number(d.slice(8,10)))+sel("year",yrs.map(x=>[x,x]),Number(d.slice(0,4)))+'</div></div><button class="action" type="submit">'+(editId?"Save Changes":"Save Planned Meal")+'</button></form>'}
function planned(){const rows=meals.filter(x=>x.status==="planned").sort((a,b)=>a.meal_date.localeCompare(b.meal_date));return '<div class="items">'+(rows.map(x=>'<div class="item"><strong>'+esc(x.entree)+'</strong><span class="meta">'+esc(dateText(x.meal_date))+'</span>'+(x.sides?'<span class="sides">'+esc(x.sides)+'</span>':"")+'<div class="actions"><button data-edit="'+x.id+'">Edit</button><button data-served="'+x.id+'">Mark Served</button><button class="danger" data-delete="'+x.id+'">×</button></div></div>').join("")||'<div class="empty">No planned meals.</div>')+'</div>'}
function history(){const served=meals.filter(x=>x.status!=="planned");if(mode==="historyDetail"){const rows=served.filter(x=>key(x.entree)===key(viewEntree)).sort((a,b)=>b.meal_date.localeCompare(a.meal_date));return '<div class="items">'+rows.map(x=>'<div class="item"><strong>'+esc(dateText(x.meal_date))+'</strong>'+(x.sides?'<span class="sides">'+esc(x.sides)+'</span>':"")+'<div class="actions"><button data-repeat="'+x.id+'">Plan Meal Again</button></div></div>').join("")+'</div>';}
let rows;if(historySort==="date")rows=[...served];else{const latest=new Map();served.forEach(x=>{let k=key(x.entree),old=latest.get(k);if(!old||x.meal_date>old.meal_date)latest.set(k,x)});rows=[...latest.values()]}rows.sort((a,b)=>historySort==="az"?a.entree.localeCompare(b.entree):(historyAsc?a.meal_date.localeCompare(b.meal_date):b.meal_date.localeCompare(a.meal_date)));
return '<div class="sort"><button data-sort="date">By Date '+(historySort==="date"?(historyAsc?"↑":"↓"):"")+'</button><button data-sort="last">Last Served '+(historySort==="last"?(historyAsc?"↑":"↓"):"")+'</button><button data-sort="az">A–Z</button></div><div class="items">'+(rows.map(x=>'<button class="item historyItem" data-history="'+esc(x.entree)+'"><strong>'+esc(x.entree)+'</strong><span class="meta">'+esc(dateText(x.meal_date))+'</span>'+(x.sides?'<span class="sides">'+esc(x.sides)+'</span>':"")+'</button>').join("")||'<div class="empty">No meals recorded yet.</div>')+'</div>'}
function mealIdeas(){return '<form id="ideaForm"><div class="field"><label for="ideaEntree">Entrée</label><input id="ideaEntree" maxlength="100" required></div><div class="field"><label for="ideaSides">Sides</label><textarea id="ideaSides" maxlength="250" placeholder="Optional sides, separated by commas"></textarea></div><button class="action">Add Meal Idea</button></form><div class="items">'+(ideas.map(x=>'<div class="item"><strong>'+esc(x.entree)+'</strong>'+(x.sides?'<span class="sides">'+esc(x.sides)+'</span>':"")+'<div class="actions"><button data-planidea="'+x.id+'">Plan This Meal</button><button class="danger" data-delidea="'+x.id+'">×</button></div></div>').join("")||'<div class="empty">No meal ideas yet.</div>')+'</div>'}
function render(){const titles={menu:"Meal Planning",plan:"Plan Meal",planned:"Planned Meals",history:"Meal History",historyDetail:viewEntree+" History",ideas:"Meal Ideas"};app.innerHTML='<header><button class="back" id="back" aria-label="Back">‹</button><h1>'+esc(titles[mode])+'</h1><img src="./uno-logo.PNG" alt="Uno Club"></header><main>'+(error?'<p class="error">'+esc(error)+'</p>':"")+(mode==="menu"?menu():mode==="plan"?plan():mode==="planned"?planned():mode==="history"||mode==="historyDetail"?history():mealIdeas())+'</main><footer>uno club meals v.'+VERSION+'</footer>';document.getElementById("back").onclick=back;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{mode=b.dataset.go;error="";render()});wire()}
function wire(){const form=document.getElementById("mealForm");if(form){wireSuggest(document.getElementById("entree"),document.getElementById("entreeMatches"),entreeNames);for(const el of document.querySelectorAll(".side")){const box=el.querySelector(".sideMatches");const input=el.querySelector("input");wireSuggest(input,box,()=>[...new Set([...meals,...ideas].flatMap(x=>sideParts(x.sides)).map(title))].sort())}const ent=document.getElementById("entree");const info=document.getElementById("servedInfo");const update=()=>{const rows=meals.filter(x=>x.status!=="planned"&&key(x.entree)===key(ent.value)).sort((a,b)=>b.meal_date.localeCompare(a.meal_date));info.textContent=rows.length?"Last Served: "+dateText(rows[0].meal_date)+" · Times Served: "+rows.length:""};ent.addEventListener("input",update);update();form.onsubmit=async e=>{e.preventDefault();error="";let entree=title(ent.value.trim());let sides=[...document.querySelectorAll(".sideInput")].map(x=>title(x.value.trim())).filter(Boolean).join(", ")||null;if(!entree){error="Enter an entrée.";render();return}const y=+document.getElementById("year").value,m=+document.getElementById("month").value,d=+document.getElementById("day").value;const valid=new Date(y,m-1,d,12);if(valid.getFullYear()!==y||valid.getMonth()!==m-1||valid.getDate()!==d){error="Choose a valid date.";render();return}const meal_date=[y,String(m).padStart(2,"0"),String(d).padStart(2,"0")].join("-");const q=editId?sb.from("club_meals").update({entree,sides,meal_date,status:"planned"}).eq("id",editId):sb.from("club_meals").insert({entree,sides,meal_date,status:"planned"});const out=await q;if(out.error){error=out.error.code==="23505"?"That entrée is already recorded for that date.":"Could not save the meal.";render();return}if(ideaId){await sb.from("meal_ideas").delete().eq("id",ideaId)}editId=repeatId=ideaId=null;await loadData();mode="planned";render()}}const ideaForm=document.getElementById("ideaForm");if(ideaForm)ideaForm.onsubmit=async e=>{e.preventDefault();const entree=title(document.getElementById("ideaEntree").value.trim()),sides=title(document.getElementById("ideaSides").value.trim())||null;if(!entree){error="Enter an entrée.";render();return}const r=await sb.from("meal_ideas").insert({entree,sides});if(r.error)error="Could not save meal idea.";else await loadData();render()};
for(const [sel,handler] of [["[data-edit]",b=>{editId=b.dataset.edit;repeatId=ideaId=null;mode="plan";render()}],["[data-repeat]",b=>{repeatId=b.dataset.repeat;editId=ideaId=null;mode="plan";render()}],["[data-planidea]",b=>{ideaId=b.dataset.planidea;editId=repeatId=null;mode="plan";render()}],["[data-history]",b=>{viewEntree=b.dataset.history;mode="historyDetail";render()}],["[data-sort]",b=>{if(historySort===b.dataset.sort)historyAsc=!historyAsc;else{historySort=b.dataset.sort;historyAsc=false}render()}]])document.querySelectorAll(sel).forEach(b=>b.onclick=()=>handler(b));
document.querySelectorAll("[data-served]").forEach(b=>b.onclick=async()=>{const r=await sb.from("club_meals").update({status:"served"}).eq("id",b.dataset.served);if(r.error)error="Could not mark meal served.";await loadData();render()});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this planned meal?"))return;const r=await sb.from("club_meals").delete().eq("id",b.dataset.delete);if(r.error)error="Could not delete meal.";await loadData();render()});
document.querySelectorAll("[data-delidea]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this meal idea?"))return;const r=await sb.from("meal_ideas").delete().eq("id",b.dataset.delidea);if(r.error)error="Could not delete idea.";await loadData();render()})}
function wireSuggest(input,box,getList){if(!input)return;const show=()=>{const q=key(input.value);box.replaceChildren();if(!q){box.style.display="none";return}getList().filter(x=>key(x).includes(q)&&key(x)!==q).slice(0,8).forEach(name=>{const b=document.createElement("button");b.type="button";b.textContent=name;b.onclick=()=>{input.value=name;box.style.display="none";input.focus();input.dispatchEvent(new Event("input"))};box.appendChild(b)});box.style.display=box.childElementCount?"block":"none"};input.addEventListener("input",show);input.addEventListener("focus",show);input.addEventListener("blur",()=>{input.value=title(input.value.trim());setTimeout(()=>box.style.display="none",150)})}
async function boot(){await loadData();render()}boot().catch(e=>{app.textContent="Could not open Meal Planning. Please refresh.";console.error(e)});
</script></body></html>
