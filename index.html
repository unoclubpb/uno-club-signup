<!doctype html>
<html>
<head>

<link rel="apple-touch-icon" href="uno-logo.PNG">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Uno Club Lists</title>

<style>

*{box-sizing:border-box}

html{
overscroll-behavior-y:none;
background:#f5f6f8
}

body{
margin:0;
min-height:100vh;
min-height:100dvh;
overscroll-behavior-y:none;
background:#f5f6f8;
color:#0b0b0b;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,textarea{font:inherit}

header{
min-height:118px;
background:#0b0b0b;
color:#fff;
display:flex;
align-items:center;
gap:.8rem;
padding:1.2rem max(1rem,calc((100vw - 620px)/2 + 1rem));
position:sticky;
top:0;
z-index:1000
}

header b{
color:#79a5f4;
font-size:.76rem;
letter-spacing:.16em
}

.headertext{
flex:1;
text-align:center
}

.headerlogo{
width:78px;
height:78px;
object-fit:contain;
border-radius:12px;
margin-left:auto;
flex:none
}

h1{
margin:.15rem 0 0;
font-size:clamp(2rem,8vw,2.7rem);
line-height:1
}

.back{
width:46px;
height:46px;
border:1px solid #3d3d3d;
background:#171717;
color:#fff;
border-radius:10px;
flex:none
}

.menu,.content{
max-width:620px;
margin:auto;
padding:1.25rem 1rem 4rem
}

.menu{
display:grid;
gap:1rem;
padding-top:2rem
}

.specialGameButton{
margin-top:48px!important
}

.todoMenuButton{
margin-top:0!important;
background:#FFEF00!important;
color:#000!important;
border:2px solid #000!important
}

.big,.add,.save,.textlist{
background:#1e5acb;
color:#fff;
border:2px solid #000;
border-radius:10px;
font-weight:800
}

.todoAddButton{
background:#FFEF00!important;
color:#000!important;
border:2px solid #000!important
}

.big{
min-height:76px;
font-size:1.35rem
}

.game,.specialGameButton{
position:relative
}

.gamecount{
position:absolute;
top:9px;
right:11px;
min-width:27px;
height:27px;
padding:0 7px;
border-radius:14px;
background:#fff;
color:#1e5acb;
display:flex;
align-items:center;
justify-content:center;
font-size:.85rem;
font-weight:900
}

form{
background:#fff;
border:1px solid #d9d9d9;
border-radius:12px;
padding:1rem;
display:grid;
gap:1rem
}

.fieldwrap{
display:grid;
gap:.45rem;
font-weight:700
}

.fieldlabel{font-weight:700}

.fieldhint{
font-size:.83rem;
font-weight:400;
color:#666
}

input,textarea{
min-height:44px;
border:1px solid #d9d9d9;
border-radius:8px;
padding:.6rem;
background:#fff;
color:#0b0b0b
}

textarea{
min-height:82px;
resize:vertical
}

.add{min-height:50px}

.red,.error{
color:#b42318;
font-weight:800
}

.head{
display:flex;
justify-content:space-between;
align-items:center;
gap:.75rem;
margin:1.5rem 0 .65rem
}

.head h2{margin:0}

.listactions{
display:flex;
gap:.5rem;
align-items:center
}

.textlist{
padding:.65rem .8rem;
white-space:nowrap
}

.clear{
background:#fff;
color:#b42318;
border:1px solid #e5b7b2;
border-radius:8px;
padding:.65rem .8rem;
white-space:nowrap
}

.list{
display:grid;
gap:.55rem
}

.empty,.row,.todoRow{
background:#fff;
border:1px solid #d9d9d9;
border-radius:10px
}

.empty{
padding:1.5rem;
text-align:center;
color:#666
}

.row{
min-height:64px;
display:flex;
align-items:center;
gap:.75rem;
padding:.65rem
}

.num{
width:30px;
height:30px;
border-radius:50%;
background:#eaf0fb;
color:#1e5acb;
display:grid;
place-items:center;
font-weight:800;
flex:none
}

.info{
min-width:0;
flex:1;
display:grid;
gap:.15rem
}

.info span{
font-size:.84rem;
color:#666
}

.name{
width:fit-content;
padding:0;
border:0;
background:transparent;
font-weight:800;
text-decoration:underline
}

.del{
width:44px;
height:44px;
border:0;
border-radius:9px;
background:#f5e8e7;
color:#b42318;
font-size:22px;
flex:none
}

.note{
font-style:italic!important;
color:#333!important
}

.editor{
display:grid;
gap:.4rem;
margin-top:.3rem
}

.editor div{
display:flex;
gap:.4rem
}

.editor button{
padding:.5rem .7rem;
border-radius:8px
}

.cancel{
background:#fff;
border:1px solid #1e5acb
}

.save{border:2px solid #000}

.count{
color:#666;
font-weight:700;
font-size:.9rem
}

.lastUpdated{
display:block;
margin-top:.18rem;
color:#888;
font-size:.76rem;
font-weight:500
}

.undoBar{
position:fixed;
left:50%;
bottom:calc(18px + env(safe-area-inset-bottom));
transform:translateX(-50%);
width:min(92vw,560px);
background:#171717;
color:#fff;
border:2px solid #000;
border-radius:10px;
padding:.8rem 1rem;
display:flex;
align-items:center;
justify-content:space-between;
gap:1rem;
z-index:2000;
box-shadow:0 4px 18px rgba(0,0,0,.22)
}

.undoBar button{
background:#FFEF00;
color:#000;
border:2px solid #000;
border-radius:8px;
padding:.5rem .9rem;
font-weight:900
}

.appVersion{
position:fixed;
left:10px;
bottom:calc(8px + env(safe-area-inset-bottom));
font-size:.68rem;
color:#000;
font-weight:400;
z-index:10
}

.specialInfo{
background:#fff;
border:1px solid #d9d9d9;
border-radius:12px;
padding:.85rem 1rem;
margin-bottom:1rem;
font-weight:700
}

.specialNameEdit{
padding:0;
border:0;
background:transparent;
color:#0b0b0b;
font-weight:800;
font-size:1rem;
text-decoration:underline;
text-decoration-style:dotted;
text-underline-offset:3px;
cursor:pointer
}

.specialEditForm{
margin-bottom:1rem
}

.specialEditButtons{
display:flex;
gap:.5rem
}

.specialEditButtons button{
flex:1;
min-height:46px;
border-radius:8px
}

.todoSectionTitle{
margin:1.5rem 0 .65rem
}

.todoSectionTitle h2{margin:0}

.todoRow{
display:flex;
align-items:flex-start;
gap:.75rem;
padding:.85rem
}

.todoInfo{
flex:1;
min-width:0;
display:grid;
gap:.3rem
}

.todoText{
font-weight:800;
font-size:1rem;
overflow-wrap:anywhere
}

.todoEditable{
width:fit-content;
max-width:100%;
padding:0;
border:0;
background:transparent;
color:#0b0b0b;
font-weight:800;
font-size:1rem;
text-align:left;
text-decoration:underline;
text-decoration-style:dotted;
text-underline-offset:3px;
cursor:pointer
}

.todoTime{
font-size:.78rem;
color:#666
}

.todoEditor{
display:grid;
gap:.5rem
}

.todoEditor textarea{
width:100%;
min-height:72px
}

.todoEditButtons{
display:flex;
gap:.5rem
}

.todoEditButtons button{
padding:.55rem .8rem;
border-radius:8px
}

.completedRow{opacity:.78}

.completedText{
text-decoration:line-through;
text-decoration-color:#999
}

.completedBadge{
display:inline-block;
width:fit-content;
font-size:.72rem;
font-weight:800;
color:#2e7d32;
background:#e7f4e8;
border-radius:999px;
padding:.2rem .5rem
}

@media(max-width:430px){

.head{
align-items:flex-start;
flex-direction:column
}

.listactions{width:100%}

.textlist,.clear{flex:1}

.headerlogo{
width:68px;
height:68px
}

}

</style>
</head>

<body>

<div id="app"></div>

<script type="module">

import {createClient}
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const APP_VERSION="2026-09-26-05";

const sb=createClient(
"https://dugemciflvwboiyneufa.supabase.co",
"sb_publishable_8Cj40yK0IGPrhBHVPn2SNQ__-B8RHBK"
);

const games={
Monday:["Hold Em","Omaha"],
Wednesday:["Tournament","Omaha"],
Thursday:["Hold Em","Omaha"]
};

const late=n=>
/\b(?:late|later)\b/i.test(n||"");

let day=null;
let game=null;
let page="main";

let players=[];
let todos=[];
let specialSettings=null;
let listUpdates=[];

let edit=null;
let todoEdit=null;
let specialEdit=false;
let error="";

let pendingDelete=null;
let deleteTimer=null;

function limit(g){

if(g==="Special Game"){
return specialSettings
?Number(specialSettings.total_seats)
:10;
}

if(g==="Hold Em")return 10;
if(g==="Omaha")return 9;

return 20;

}

function maxPreferredSeat(g){

if(g==="Special Game"){
return specialSettings
?Number(specialSettings.total_seats)
:10;
}

return g==="Omaha"?9:10;

}

async function load(){

const [
playerResult,
todoResult,
specialResult,
updateResult
]=await Promise.all([

sb
.from("signup_players")
.select("*")
.order("created_at")
.order("id"),

sb
.from("todo_items")
.select("*")
.order("created_at"),

sb
.from("special_game_settings")
.select("*")
.eq("id",1)
.maybeSingle(),

sb
.from("list_updates")
.select("*")

]);

if(playerResult.error){
error="Could not load the player list.";
}else{
players=playerResult.data||[];
}

if(todoResult.error){
error="Could not load the To-Do list.";
}else{
todos=todoResult.data||[];
}

if(specialResult.error){
error="Could not load the Special Game settings.";
}else{
specialSettings=specialResult.data||null;
}

if(updateResult.error){
listUpdates=[];
}else{
listUpdates=updateResult.data||[];
}

render();

}

const current=()=>
players.filter(
p=>p.day===day&&p.game===game
);

function gameCount(d,g){

return players.filter(
p=>p.day===d&&p.game===g
).length;

}

function specialCount(){

return players.filter(
p=>
p.day==="Special Game" &&
p.game==="Special Game"
).length;

}

function shown(){

if(!game)return[];

let n=0;

const a=current().map(p=>{

const alt=
late(p.notes)||
n>=limit(game);

if(!alt)n++;

return{
...p,
alt,
num:alt?null:n
};

});

return[
...a.filter(p=>!p.alt),
...a.filter(p=>p.alt)
];

}

function esc(s){

return String(s??"")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[m]);

}

function countLabel(count,singular,plural){

return `${count} ${count===1?singular:plural}`;

}

function lastUpdatedFor(d=day,g=game){

const row=
listUpdates.find(
x=>x.day===d&&x.game===g
);

return row
?row.updated_at
:null;

}

function formatLastUpdated(value){

if(!value)
return "No changes yet";

const d=new Date(value);

return "Last updated "+
d.toLocaleTimeString(
undefined,
{
hour:"numeric",
minute:"2-digit"
}
);

}

async function touchList(d=day,g=game){

if(!d||!g)return;

const now=
new Date().toISOString();

const r=
await sb
.from("list_updates")
.upsert(
{
day:d,
game:g,
updated_at:now
},
{
onConflict:"day,game"
}
)
.select()
.single();

if(!r.error){

listUpdates=
listUpdates.filter(
x=>!(
x.day===d &&
x.game===g
)
);

listUpdates.push(r.data);

}

}

function formatDateTime(value){

if(!value)return "";

const d=new Date(value);

return d.toLocaleString(
undefined,
{
month:"numeric",
day:"numeric",
year:"2-digit",
hour:"numeric",
minute:"2-digit"
}
);

}

function renderHeader(title,subtitle=""){

const showSmallUnoClub=
!(page==="main" && !day && !game);

return `

<header>

${page!=="main" || day || game
?'<button class="back" id="back">←</button>'
:""}

<div class="headertext">

${showSmallUnoClub
?'<b>UNO CLUB</b>'
:""}

<h1>${esc(title)}</h1>

${subtitle
?`<small>${esc(subtitle)}</small>`
:""}

</div>

<img
class="headerlogo"
src="uno-logo.PNG"
alt="Uno Club Lists">

</header>

`;

}

function render(){

const a=document.querySelector("#app");
let h="";

if(page==="todo"){

h+=renderHeader("To-Do");
h+=renderTodoPage();
a.innerHTML=h;
wireTodo();
return;

}

if(page==="special"){

const title=
specialSettings
?specialSettings.game_name
:"Special Game";

h+=renderHeader(title);
h+=renderSpecialPage();
a.innerHTML=h;
wireSpecial();
return;

}

h+=renderHeader(
game||day||"Uno Club Lists",
game?`${day} Night`:""
);

if(!day){

const specialName=
specialSettings
?specialSettings.game_name
:"Special Game";

const sc=specialCount();

h+=`

<section class="menu">

${Object.keys(games)
.map(x=>

`<button
class="big day"
data-v="${x}">
${x}
</button>`

).join("")}

<button
class="big specialGameButton"
id="specialGameButton">

${esc(specialName)}

${sc
?`<span class="gamecount">${sc}</span>`
:""}

</button>

<button
class="big todoMenuButton"
id="todoMenuButton">
To-Do
</button>

</section>

<div class="appVersion">
Version ${APP_VERSION}
</div>

`;

}

else if(!game){

h+=`

<section class="menu">

${games[day]
.map(x=>{

const total=gameCount(day,x);

return `

<button
class="big game"
data-v="${x}">

${x}

<span class="gamecount">
${total}
</span>

</button>

`;

}).join("")}

</section>

`;

}

else{

h+=renderPlayerPage();

}

a.innerHTML=h;
wire();

}

function specialSettingsForm(editing=false){

return `

<form
id="${editing?"specialEditForm":"specialSetupForm"}"
class="${editing?"specialEditForm":""}"
autocomplete="off">

<div class="fieldwrap">

<div class="fieldlabel">
Game Name
</div>

<input
id="specialGameName"
type="text"
maxlength="80"
value="${editing?esc(specialSettings.game_name):""}"
autocomplete="new-password"
autocorrect="off"
autocapitalize="words"
spellcheck="false">

</div>

<div class="fieldwrap">

<div class="fieldlabel">
Total Seats
</div>

<div class="fieldhint">
Enter 6, 7, 8, 9 or 10.
</div>

<input
id="specialSeats"
type="text"
inputmode="numeric"
value="${editing?specialSettings.total_seats:""}"
autocomplete="new-password"
autocorrect="off"
spellcheck="false">

</div>

${error
?`<p class="error">${esc(error)}</p>`
:""}

${editing

?`

<div class="specialEditButtons">

<button class="save">
Save Changes
</button>

<button
type="button"
class="cancel"
id="cancelSpecialEdit">
Cancel
</button>

</div>

`

:`

<button class="add">
Set Up Game
</button>

`}

</form>

`;

}

function renderSpecialPage(){

if(!specialSettings){

return `

<section class="content">

${specialSettingsForm(false)}

</section>

`;

}

day="Special Game";
game="Special Game";

return renderPlayerPage(true);

}

function renderPlayerPage(isSpecial=false){

const sh=shown();
const regularPlayers=sh.filter(p=>!p.alt);
const alternatePlayers=sh.filter(p=>p.alt);
const rc=regularPlayers.length;
const seatLimit=maxPreferredSeat(game);

return `

<section class="content">

${isSpecial

?specialEdit

?specialSettingsForm(true)

:`

<div class="specialInfo">

<button
class="specialNameEdit"
id="specialNameEdit"
type="button">
${esc(specialSettings.game_name)}
</button>

· ${specialSettings.total_seats} Seats

</div>

`

:""}

<form id="form" autocomplete="off">

<div class="fieldwrap">

<div class="fieldlabel">
Player Name
</div>

<input
id="unoEntryA"
type="text"
autocomplete="new-password"
autocorrect="off"
autocapitalize="words"
spellcheck="false">

</div>

${game!=="Tournament" && rc<limit(game)

?`

<div class="fieldwrap">

<div class="fieldlabel">
Preferred Seat
</div>

<div class="fieldhint">
(optional — 1 through ${seatLimit})
</div>

<input
id="unoEntryB"
type="text"
inputmode="numeric"
autocomplete="new-password"
autocorrect="off"
spellcheck="false">

</div>

`

:""}

<div class="fieldwrap">

<div class="fieldlabel">
Notes
</div>

<div class="fieldhint">
(optional)
</div>

<input
id="unoEntryC"
type="text"
autocomplete="new-password"
autocorrect="off"
spellcheck="false">

</div>

<div id="altmsg"></div>

<button class="add">
Add Player
</button>

</form>

${!specialEdit && error
?`<p class="error">${esc(error)}</p>`
:""}

<div class="head">

<div>

<h2>Player List</h2>

<span class="count">
${countLabel(regularPlayers.length,"Player","Players")} / ${countLabel(alternatePlayers.length,"Alternate","Alternates")}
</span>

<span class="lastUpdated">
${formatLastUpdated(lastUpdatedFor())}
</span>

</div>

<div class="listactions">

${current().length

?`

<button class="textlist" id="textlist">
Text List
</button>

<button class="clear" id="clear">
Clear List
</button>

`

:""}

</div>
</div>

<div class="list">

${!sh.length

?`

<div class="empty">
No players added yet.
</div>

`

:

sh.map(p=>`

<div class="row">

<div class="num">
${p.alt?"A":p.num}
</div>

<div class="info">

<button class="name" data-id="${p.id}">
${esc(p.player_name)}
</button>

${p.alt

?`

<span class="red">
ALTERNATE
</span>

`

:

game!=="Tournament" && p.preferred_seat

?`

<span>
Preferred seat: ${p.preferred_seat}
</span>

`

:""}

${p.notes

?`

<span class="note">
Note: ${esc(p.notes)}
</span>

`

:""}

${edit==p.id

?`

<div class="editor">

<input
id="unoEntryD"
type="text"
value="${esc(p.notes||"")}"
autocomplete="new-password"
autocorrect="off"
spellcheck="false">

<div>

<button class="save" data-save="${p.id}">
Save Note
</button>

<button class="cancel" id="cancel">
Cancel
</button>

</div>
</div>

`

:""}

</div>

<button class="del" data-del="${p.id}">
×
</button>

</div>

`).join("")}

</div>

</section>

${pendingDelete

?`

<div class="undoBar">

<span>
${esc(pendingDelete.player.player_name)} removed
</span>

<button id="undoDelete">
Undo
</button>

</div>

`

:""}

`;

}

function renderTodoPage(){

const active=
todos
.filter(t=>!t.completed_at)
.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

const completed=
todos
.filter(t=>t.completed_at)
.sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at))
.slice(0,25);

return `

<section class="content">

<form id="todoForm" autocomplete="off">

<div class="fieldwrap">

<div class="fieldlabel">
To-Do Item
</div>

<textarea
id="unoEntryE"
maxlength="500"
autocomplete="new-password"
autocorrect="off"
spellcheck="false"></textarea>

</div>

<button class="add todoAddButton">
Add To-Do
</button>

</form>

${error
?`<p class="error">${esc(error)}</p>`
:""}

<div class="todoSectionTitle">

<h2>To-Do</h2>

<span class="count">
${countLabel(active.length,"Item","Items")}
</span>

</div>

<div class="list">

${!active.length

?`

<div class="empty">
Nothing currently needs to be done.
</div>

`

:

active.map(t=>`

<div class="todoRow">

<div class="todoInfo">

${String(todoEdit)===String(t.id)

?`

<div class="todoEditor">

<textarea
id="unoEntryF"
maxlength="500"
autocomplete="new-password"
autocorrect="off"
spellcheck="false">${esc(t.note)}</textarea>

<div class="todoEditButtons">

<button class="save" data-todo-save="${t.id}">
Save
</button>

<button class="cancel" id="todoEditCancel">
Cancel
</button>

</div>
</div>

`

:`

<button class="todoEditable" data-todo-edit="${t.id}">
${esc(t.note)}
</button>

`}

<div class="todoTime">
Entered: ${formatDateTime(t.created_at)}
</div>

</div>

<button class="del" data-complete="${t.id}">
×
</button>

</div>

`).join("")}

</div>

<div class="todoSectionTitle">

<h2>Completed</h2>

<span class="count">
Most recent 25
</span>

</div>

<div class="list">

${!completed.length

?`

<div class="empty">
No completed items yet.
</div>

`

:

completed.map(t=>`

<div class="todoRow completedRow">

<div class="todoInfo">

<span class="completedBadge">
COMPLETED
</span>

<div class="todoText completedText">
${esc(t.note)}
</div>

<div class="todoTime">
Entered: ${formatDateTime(t.created_at)}
</div>

<div class="todoTime">
Completed: ${formatDateTime(t.completed_at)}
</div>

</div>

<button class="del" data-delete-completed="${t.id}">
×
</button>

</div>

`).join("")}

</div>

</section>

`;

}

b.onclick=()=>{
day=b.dataset.v;
render();
};

render();

});

function validSpecialValues(){

const name=
document.querySelector("#specialGameName")
.value.trim();

const seatValue=
document.querySelector("#specialSeats")
.value.trim();

if(!name){

error="Please enter a game name.";
render();
return null;

}

if(
!/^\d+$/.test(seatValue) ||
![6,7,8,9,10].includes(Number(seatValue))
){

error="Total Seats must be 6, 7, 8, 9 or 10.";
render();
return null;

}

return{
name,
seats:Number(seatValue)
};

}

async function saveSpecialSetup(e){

e.preventDefault();
error="";

const values=validSpecialValues();

if(!values)return;

const r=
await sb
.from("special_game_settings")
.upsert({
id:1,
game_name:values.name,
total_seats:values.seats,
updated_at:new Date().toISOString()
})
.select()
.single();

if(r.error){

error="Could not save the Special Game setup.";
render();
return;

}

specialSettings=r.data;
day="Special Game";
game="Special Game";
specialEdit=false;

await touchList();

render();

}

async function saveSpecialEdit(e){

e.preventDefault();
error="";

const name=
document.querySelector("#specialGameName")
.value.trim();

const seatValue=
document.querySelector("#specialSeats")
.value.trim();

if(!name){

error="Please enter a game name.";
render();
return;

}

if(
!/^\d+$/.test(seatValue) ||
![6,7,8,9,10].includes(Number(seatValue))
){

error="Total Seats must be 6, 7, 8, 9 or 10.";
render();
return;

}

const newSeats=Number(seatValue);

const settingsResult=
await sb
.from("special_game_settings")
.update({
game_name:name,
total_seats:newSeats,
updated_at:new Date().toISOString()
})
.eq("id",1)
.select()
.single();

if(settingsResult.error){

error="Could not save the Special Game changes.";
render();
return;

}

const invalidSeatPlayers=
players.filter(
p=>
p.day==="Special Game" &&
p.game==="Special Game" &&
p.preferred_seat &&
Number(p.preferred_seat)>newSeats
);

if(invalidSeatPlayers.length){

const ids=
invalidSeatPlayers.map(p=>p.id);

const clearSeats=
await sb
.from("signup_players")
.update({
preferred_seat:null
})
.in("id",ids);

if(clearSeats.error){

error=
"The game was updated, but some preferred seats could not be cleared.";

specialSettings=settingsResult.data;
specialEdit=false;
render();
return;

}

const idSet=
new Set(ids.map(String));

players=
players.map(p=>
idSet.has(String(p.id))
?{...p,preferred_seat:null}
:p
);

}

specialSettings=settingsResult.data;
specialEdit=false;
error="";

await touchList();

render();

}

function buildTextList(){

const sh=shown();
const regular=sh.filter(p=>!p.alt);
const alternates=sh.filter(p=>p.alt);

let lines=[];

const heading=
game==="Special Game" && specialSettings
?`Uno Club – ${specialSettings.game_name}`
:`Uno Club – ${day} ${game}`;

lines.push(heading);
lines.push("");

regular.forEach(p=>{

let line=`${p.num}. ${p.player_name}`;

if(game!=="Tournament" && p.preferred_seat){
line+=` — Preferred Seat ${p.preferred_seat}`;
}

if(p.notes){
line+=` — Note: ${p.notes}`;
}

lines.push(line);

});

if(alternates.length){

if(regular.length)lines.push("");

lines.push("Alternates");

alternates.forEach(p=>{

let line=`A. ${p.player_name}`;

if(p.notes){
line+=` — Note: ${p.notes}`;
}

lines.push(line);

});

}

return lines.join("\n");

}

function textList(){

if(!current().length)return;

window.location.href=
"sms:&body="+encodeURIComponent(buildTextList());

}

async function add(e){

e.preventDefault();
error="";

const name=document.querySelector("#unoEntryA").value.trim();
const notes=document.querySelector("#unoEntryC").value.trim();

const sh=shown();
const rc=sh.filter(p=>!p.alt).length;

const alt=late(notes)||rc>=limit(game);

const se=document.querySelector("#unoEntryB");
const seat=se?se.value.trim():"";

if(!name)return;

if(current().some(p=>p.player_name===name)){

error="That player is already on this list.";
render();
return;

}

if(game!=="Tournament" && !alt && seat){

const maxSeat=maxPreferredSeat(game);

if(
!/^\d+$/.test(seat) ||
+seat<1 ||
+seat>maxSeat
){

error=`Invalid response. Preferred seat must be a number from 1 to ${maxSeat}.`;
render();
return;

}

if(
current().some(
p=>String(p.preferred_seat??"")===String(+seat)
)
){

error="That preferred seat is already taken. Choose another seat or leave the seat blank.";
render();
return;

}

}

const r=
await sb
.from("signup_players")
.insert({

day,
game,
player_name:name,

preferred_seat:
game==="Tournament" || alt
?null
:(seat?+seat:null),

notes:notes||null

})
.select()
.single();

if(r.error){

error=
r.error.code==="23505"
?"That player name or preferred seat is already on this list."
:r.error.message;

}else{

players.push(r.data);
await touchList();

}

render();

}

async function finalizePendingDelete(){

if(!pendingDelete)return;

const item=pendingDelete;
const p=item.player;

pendingDelete=null;

if(deleteTimer){
clearTimeout(deleteTimer);
deleteTimer=null;
}

const r=
await sb
.from("signup_players")
.delete()
.eq("id",p.id);

if(r.error){

players.push(p);

players.sort(
(a,b)=>
new Date(a.created_at)-
new Date(b.created_at)
);

error=r.error.message;

}else{

await touchList(
p.day,
p.game
);

}

render();

}

async function del(id){

if(pendingDelete){

await finalizePendingDelete();

}

const p=
players.find(
x=>String(x.id)===String(id)
);

if(!p)return;

pendingDelete={
player:{...p}
};

players=
players.filter(
x=>String(x.id)!==String(id)
);

render();

deleteTimer=
setTimeout(
finalizePendingDelete,
5000
);

}

function undoPlayerDelete(){

if(!pendingDelete)return;

const p=
pendingDelete.player;

if(deleteTimer){

clearTimeout(deleteTimer);
deleteTimer=null;

}

pendingDelete=null;

players.push(p);

players.sort(
(a,b)=>
new Date(a.created_at)-
new Date(b.created_at)
);

render();

}

async function clear(){

if(pendingDelete){
await finalizePendingDelete();
}

const special=game==="Special Game";

const label=
special && specialSettings
?specialSettings.game_name
:`${day} ${game}`;

const question=
special
?`Clear the entire ${label} list and reset Special Game?`
:`Clear the entire ${label} list?`;

if(!confirm(question))return;

const clearDay=day;
const clearGame=game;

const r=
await sb
.from("signup_players")
.delete()
.eq("day",clearDay)
.eq("game",clearGame);

if(r.error){

error=r.error.message;
render();
return;

}

players=
players.filter(
p=>!(
p.day===clearDay &&
p.game===clearGame
)
);

await touchList(
clearDay,
clearGame
);

if(special){

const settingsDelete=
await sb
.from("special_game_settings")
.delete()
.eq("id",1);

if(settingsDelete.error){

error="Players were cleared, but the Special Game setup could not be reset.";
render();
return;

}

specialSettings=null;
day=null;
game=null;
page="main";
specialEdit=false;

}

render();

}

async function save(id){

const note=
document.querySelector("#unoEntryD")
.value
.trim();

const r=
await sb
.from("signup_players")
.update({
notes:note||null
})
.eq("id",id)
.select()
.single();

if(r.error){

error=r.error.message;

}else{

players=
players.map(
p=>
String(p.id)===String(id)
?r.data
:p
);

await touchList();

}

edit=null;
render();

}

async function addTodo(e){

e.preventDefault();
error="";

const note=document.querySelector("#unoEntryE").value.trim();

if(!note)return;

const r=
await sb
.from("todo_items")
.insert({note})
.select()
.single();

if(r.error){

error="Could not add the To-Do item.";

}else{

todos.push(r.data);

}

render();

}

async function saveTodoEdit(id){

const field=document.querySelector("#unoEntryF");

if(!field)return;

const note=field.value.trim();

if(!note){

error="To-Do item cannot be blank.";
render();
return;

}

const r=
await sb
.from("todo_items")
.update({note})
.eq("id",id)
.is("completed_at",null)
.select()
.single();

if(r.error){

error="Could not save the To-Do item.";
render();
return;

}

todos=
todos.map(
t=>String(t.id)===String(id)?r.data:t
);

todoEdit=null;
error="";
render();

}

async function completeTodo(id){

const item=
todos.find(t=>String(t.id)===String(id));

if(!item)return;

if(!confirm(`Mark this item completed?\n\n${item.note}`))
return;

const r=
await sb
.from("todo_items")
.update({
completed_at:new Date().toISOString()
})
.eq("id",id)
.select()
.single();

if(r.error){

error="Could not complete that item.";
render();
return;

}

todos=
todos.map(
t=>String(t.id)===String(id)?r.data:t
);

todoEdit=null;

await trimCompletedTodos();

render();

}

async function deleteCompletedTodo(id){

const item=
todos.find(t=>String(t.id)===String(id));

if(!item)return;

if(!confirm(`Permanently delete this completed item?\n\n${item.note}`))
return;

const r=
await sb
.from("todo_items")
.delete()
.eq("id",id)
.not("completed_at","is",null);

if(r.error){

error="Could not delete that completed item.";
render();
return;

}

todos=
todos.filter(t=>String(t.id)!==String(id));

error="";
render();

}

async function trimCompletedTodos(){

const completed=
todos
.filter(t=>t.completed_at)
.sort(
(a,b)=>
new Date(b.completed_at)-
new Date(a.completed_at)
);

if(completed.length<=25)return;

const oldIds=
completed.slice(25).map(t=>t.id);

const r=
await sb
.from("todo_items")
.delete()
.in("id",oldIds);

if(!r.error){

const removeSet=
new Set(oldIds.map(String));

todos=
todos.filter(
t=>!removeSet.has(String(t.id))
);

}

}

async function checkForUpdate(){

try{

const response=
await fetch(
window.location.pathname+
"?updatecheck="+
Date.now(),
{
cache:"no-store"
}
);

const html=
await response.text();

const match=
html.match(
/const APP_VERSION="([^"]+)"/
);

if(
match &&
match[1] &&
match[1]!==APP_VERSION
){

window.location.replace(
window.location.pathname+
"?v="+
encodeURIComponent(match[1])
);

}

}catch(e){}

}

document.addEventListener(
"visibilitychange",
()=>{

if(
document.visibilityState==="visible"
){

checkForUpdate();

}

}
);

window.addEventListener(
"pageshow",
()=>{

checkForUpdate();

}
);

load();

</script>
