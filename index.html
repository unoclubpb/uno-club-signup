<title>Uno Club Lists</title>
<style>
*{box-sizing:border-box}html{overscroll-behavior-y:none;background:#f5f6f8}body{margin:0;min-height:100dvh;background:#f5f6f8;color:#0b0b0b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
header{min-height:118px;background:#0b0b0b;color:#fff;display:flex;align-items:center;gap:.8rem;padding:1.2rem max(1rem,calc((100vw - 620px)/2 + 1rem));position:sticky;top:0;z-index:1000}header b{color:#79a5f4;font-size:.76rem;letter-spacing:.16em}.headertext{flex:1;text-align:center}.headerlogo{width:78px;height:78px;object-fit:contain;border-radius:12px;margin-left:auto;flex:none}h1{margin:.15rem 0 0;font-size:clamp(2rem,8vw,2.7rem);line-height:1}.back{width:46px;height:46px;border:2px solid #000;background:#171717;color:#fff;border-radius:10px;flex:none}
.menu,.content{max-width:620px;margin:auto;padding:1.25rem 1rem 4rem}.menu{display:grid;gap:1rem;padding-top:2rem}.specialGameButton{margin-top:48px!important}.todoMenuButton{margin-top:0!important;background:#FFEF00!important;color:#000!important;border:2px solid #000!important}
.big,.add,.save,.textlist{background:#1e5acb;color:#fff;border:2px solid #000;border-radius:10px;font-weight:800}.big{min-height:76px;font-size:1.35rem}.game,.specialGameButton,.day{position:relative}.tonight{box-shadow:0 0 0 4px #FFEF00,0 4px 12px rgba(0,0,0,.18);transform:scale(1.015)}.tonight::after{content:"TONIGHT";position:absolute;left:10px;top:8px;font-size:.65rem;letter-spacing:.08em;background:#FFEF00;color:#000;border:1px solid #000;border-radius:5px;padding:2px 5px}
.gamecount{position:absolute;top:9px;right:11px;min-width:27px;height:27px;padding:0 7px;border-radius:14px;background:#fff;color:#1e5acb;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900}
form{background:#fff;border:1px solid #d9d9d9;border-radius:12px;padding:1rem;display:grid;gap:1rem}.fieldwrap{display:grid;gap:.45rem;font-weight:700}.fieldhint{font-size:.83rem;font-weight:400;color:#666}input,textarea{min-height:44px;border:1px solid #d9d9d9;border-radius:8px;padding:.6rem;background:#fff;color:#0b0b0b}textarea{min-height:82px;resize:vertical}.add{min-height:50px}.todoAddButton{background:#FFEF00!important;color:#000!important;border:2px solid #000!important}.red,.error{color:#b42318;font-weight:800}
.suggestions{display:none;border:1px solid #bbb;border-radius:8px;background:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.12)}.suggestions.show{display:block}.suggestion{display:block;width:100%;text-align:left;padding:.65rem .75rem;background:#fff;border:0;border-bottom:1px solid #eee;color:#111}.suggestion:last-child{border-bottom:0}.suggestion small{display:block;color:#666;margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin:1.5rem 0 .65rem}.head h2{margin:0}.listactions{display:flex;gap:.5rem}.textlist,.clear{padding:.65rem .8rem}.clear{background:#fff;color:#b42318;border:2px solid #000;border-radius:8px}.list{display:grid;gap:.55rem}.empty,.row,.todoRow{background:#fff;border:1px solid #d9d9d9;border-radius:10px}.empty{padding:1.5rem;text-align:center;color:#666}.row{min-height:64px;display:flex;align-items:center;gap:.75rem;padding:.65rem}.num{width:30px;height:30px;border-radius:50%;background:#eaf0fb;color:#1e5acb;display:grid;place-items:center;font-weight:800;flex:none}.info{min-width:0;flex:1;display:grid;gap:.15rem}.info span{font-size:.84rem;color:#666}.name{width:fit-content;padding:0;border:0;background:transparent;font-weight:800;text-decoration:underline}.del{width:44px;height:44px;border:2px solid #000;border-radius:9px;background:#f5e8e7;color:#b42318;font-size:22px;flex:none}.note{font-style:italic!important;color:#333!important}.signupTime{font-size:.76rem!important;color:#888!important}.editor{display:grid;gap:.4rem;margin-top:.3rem}.editor div{display:flex;gap:.4rem}.editor button{padding:.5rem .7rem;border-radius:8px}.cancel{background:#fff;border:2px solid #000}.count{color:#666;font-weight:700;font-size:.9rem}.lastUpdated{display:block;margin-top:.18rem;color:#888;font-size:.76rem}
.undoBar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,560px);background:#171717;color:#fff;border:2px solid #000;border-radius:10px;padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;z-index:2000}.undoBar button{background:#FFEF00;color:#000;border:2px solid #000;border-radius:8px;padding:.5rem .9rem;font-weight:900}.appVersion{position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:.68rem;color:#000;z-index:10}
.specialInfo{background:#fff;border:1px solid #d9d9d9;border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem;font-weight:700}.specialNameEdit{padding:0;border:0;background:transparent;color:#0b0b0b;font-weight:800;text-decoration:underline dotted;cursor:pointer}.specialEditButtons{display:flex;gap:.5rem}.specialEditButtons button{flex:1;min-height:46px;border-radius:8px}
.todoSectionTitle{margin:1.5rem 0 .65rem}.todoSectionTitle h2{margin:0}.todoRow{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem}.todoInfo{flex:1;display:grid;gap:.3rem}.todoEditable{width:fit-content;max-width:100%;padding:0;border:0;background:transparent;color:#0b0b0b;font-weight:800;text-align:left;text-decoration:underline dotted}.todoTime{font-size:.78rem;color:#666}.todoEditor{display:grid;gap:.5rem}.todoEditButtons{display:flex;gap:.5rem}.completedRow{opacity:.78}.completedText{text-decoration:line-through}.completedBadge{display:inline-block;width:fit-content;font-size:.72rem;font-weight:800;color:#2e7d32;background:#e7f4e8;border-radius:999px;padding:.2rem .5rem}
@media(max-width:430px){.head{align-items:flex-start;flex-direction:column}.listactions{width:100%}.textlist,.clear{flex:1}.headerlogo{width:68px;height:68px}}
</style>

<body><div id="app"></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const APP_VERSION="092826.3";
const sb=createClient("https://dugemciflvwboiyneufa.supabase.co","sb_publishable_8Cj40yK0IGPrhBHVPn2SNQ__-B8RHBK");
const games={Monday:["Hold Em","Omaha"],Wednesday:["Tournament","Omaha"],Thursday:["Hold Em","Omaha"]};

function arrivesAfter715(note){
 const text=String(note||"");
 const re=/\b(1[0-2]|[1-9])(?:\s*[:.]\s*([0-5]\d))?\s*(a\.?\s*m\.?|p\.?\s*m\.?)?\b/gi;
 let m;
 while((m=re.exec(text))!==null){
  let h=Number(m[1]),min=m[2]!==undefined?Number(m[2]):0,mer=(m[3]||"").replace(/[\s.]/g,"").toLowerCase(),h24=null;
  if(mer==="pm") h24=h===12?12:h+12;
  else if(mer==="am") h24=h===12?0:h;
  else if(h>=7&&h<=11) h24=h+12;
  if(h24!==null && h24*60+min>19*60+15)return true;
 }
 return false;
}
const late=n=>/\b(?:late|later)\b/i.test(n||"")||arrivesAfter715(n);

let day=null,game=null,page="main",players=[],todos=[],specialSettings=null,listUpdates=[],directory=[];
let edit=null,todoEdit=null,specialEdit=false,error="",pendingDelete=null,deleteTimer=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const formatPlayerName=s=>String(s||"").trim().toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase());
const limit=g=>g==="Special Game"?(specialSettings?+specialSettings.total_seats:10):g==="Hold Em"?10:g==="Omaha"?9:20;
const maxPreferredSeat=g=>g==="Special Game"?(specialSettings?+specialSettings.total_seats:10):g==="Omaha"?9:10;
const current=()=>players.filter(p=>p.day===day&&p.game===game);
const gameCount=(d,g)=>players.filter(p=>p.day===d&&p.game===g).length;
const specialCount=()=>players.filter(p=>p.day==="Special Game"&&p.game==="Special Game").length;
const countLabel=(n,a,b)=>`${n} ${n===1?a:b}`;
const sortBySignup=a=>[...a].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)||(Number(x.id)||0)-(Number(y.id)||0));

function shown(){
 if(!game)return[];
 let n=0;
 const a=sortBySignup(current()).map(p=>{
  const forced=late(p.notes);
  const alt=forced||n>=limit(game);
  if(!alt)n++;
  return {...p,alt,forcedLate:forced,num:alt?null:n};
 });
 return [...a.filter(p=>!p.alt),...a.filter(p=>p.alt)];
}
function formatSignup(v){return new Date(v).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function lastUpdatedFor(d=day,g=game){return listUpdates.find(x=>x.day===d&&x.game===g)?.updated_at||null}
function formatLastUpdated(v){return v?"Last updated "+formatSignup(v):"No changes yet"}
function formatDateTime(v){return v?new Date(v).toLocaleString(undefined,{month:"numeric",day:"numeric",year:"2-digit",hour:"numeric",minute:"2-digit"}):""}
async function touchList(d=day,g=game){
 if(!d||!g)return;
 const r=await sb.from("list_updates").upsert({day:d,game:g,updated_at:new Date().toISOString()},{onConflict:"day,game"}).select().single();
 if(!r.error){listUpdates=listUpdates.filter(x=>!(x.day===d&&x.game===g));listUpdates.push(r.data)}
}
async function load(){
 const [pr,tr,sr,ur,dr]=await Promise.all([
  sb.from("signup_players").select("*").order("created_at").order("id"),
  sb.from("todo_items").select("*").order("created_at"),
  sb.from("special_game_settings").select("*").eq("id",1).maybeSingle(),
  sb.from("list_updates").select("*"),
  sb.from("player_directory").select("*").order("player_name")
 ]);
 if(pr.error)error="Could not load the player list.";else players=pr.data||[];
 if(tr.error)error="Could not load the To-Do list.";else todos=tr.data||[];
 if(sr.error)error="Could not load the Special Game settings.";else specialSettings=sr.data||null;
 listUpdates=ur.error?[]:(ur.data||[]);
 directory=dr.error?[]:(dr.data||[]);
 render();
}
function renderHeader(title,subtitle=""){
 const small=!(page==="main"&&!day&&!game);
 return `<header>${page!=="main"||day||game?'<button class="back" id="back">←</button>':""}<div class="headertext">${small?'<b>UNO CLUB</b>':""}<h1>${esc(title)}</h1>${subtitle?`<small>${esc(subtitle)}</small>`:""}</div><img class="headerlogo" src="uno-logo.PNG" alt="Uno Club Lists"></header>`;
}
function render(){
 const a=document.querySelector("#app");let h="";
 if(page==="todo"){a.innerHTML=renderHeader("To-Do")+renderTodoPage();wireTodo();return}
 if(page==="special"){a.innerHTML=renderHeader(specialSettings?specialSettings.game_name:"Special Game")+renderSpecialPage();wireSpecial();return}
 h+=renderHeader(game||day||"Uno Club Lists",game?`${day} Night`:"");
 if(!day){
  const specialName=specialSettings?specialSettings.game_name:"Special Game",sc=specialCount();
  const today=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];
  h+=`<section class="menu">${Object.keys(games).map(x=>`<button class="big day ${x===today?"tonight":""}" data-v="${x}">${x}</button>`).join("")}
  <button class="big specialGameButton" id="specialGameButton">${esc(specialName)}${sc?`<span class="gamecount">${sc}</span>`:""}</button>
  <button class="big todoMenuButton" id="todoMenuButton">To-Do</button></section><div class="appVersion">Version ${APP_VERSION}</div>`;
 }else if(!game){
  h+=`<section class="menu">${games[day].map(x=>`<button class="big game" data-v="${x}">${x}<span class="gamecount">${gameCount(day,x)}</span></button>`).join("")}</section>`;
 }else h+=renderPlayerPage();
 a.innerHTML=h;wire();
}
function specialSettingsForm(editing=false){
 return `<form id="${editing?"specialEditForm":"specialSetupForm"}" autocomplete="off">
 <div class="fieldwrap"><div>Game Name</div><input id="specialGameName" maxlength="80" value="${editing?esc(specialSettings.game_name):""}" autocomplete="new-password"></div>
 <div class="fieldwrap"><div>Total Seats</div><div class="fieldhint">Enter 6, 7, 8, 9 or 10.</div><input id="specialSeats" inputmode="numeric" value="${editing?specialSettings.total_seats:""}" autocomplete="new-password"></div>
 ${error?`<p class="error">${esc(error)}</p>`:""}
 ${editing?`<div class="specialEditButtons"><button class="save">Save Changes</button><button type="button" class="cancel" id="cancelSpecialEdit">Cancel</button></div>`:`<button class="add">Set Up Game</button>`}</form>`;
}
function renderSpecialPage(){
 if(!specialSettings)return `<section class="content">${specialSettingsForm(false)}</section>`;
 day="Special Game";game="Special Game";return renderPlayerPage(true);
}
function renderPlayerPage(isSpecial=false){
 const sh=shown(),regular=sh.filter(p=>!p.alt),alts=sh.filter(p=>p.alt),rc=regular.length,seatLimit=maxPreferredSeat(game);
 return `<section class="content">
 ${isSpecial?(specialEdit?specialSettingsForm(true):`<div class="specialInfo"><button class="specialNameEdit" id="specialNameEdit">${esc(specialSettings.game_name)}</button> · ${specialSettings.total_seats} Seats</div>`):""}
 <form id="form" autocomplete="off">
 <div class="fieldwrap"><div>Player Name</div><input id="unoEntryA" autocomplete="new-password" autocorrect="off" autocapitalize="words" spellcheck="false"><div id="nameSuggestions" class="suggestions"></div></div>
 ${game!=="Tournament"&&rc<limit(game)?`<div class="fieldwrap"><div>Preferred Seat</div><div class="fieldhint">(optional — 1 through ${seatLimit})</div><input id="unoEntryB" inputmode="numeric" autocomplete="new-password"><div id="seatHint" class="fieldhint"></div></div>`:""}
 <div class="fieldwrap"><div>Notes</div><div class="fieldhint">(optional)</div><input id="unoEntryC" autocomplete="new-password" autocorrect="off" spellcheck="false"></div>
 <div id="altmsg"></div><button class="add">Add Player</button></form>
 ${!specialEdit&&error?`<p class="error">${esc(error)}</p>`:""}
 <div class="head"><div><h2>Player List</h2><span class="count">${countLabel(regular.length,"Player","Players")} / ${countLabel(alts.length,"Alternate","Alternates")}</span><span class="lastUpdated">${formatLastUpdated(lastUpdatedFor())}</span></div>
 <div class="listactions">${current().length?`<button class="textlist" id="textlist">Text List</button><button class="clear" id="clear">Clear List</button>`:""}</div></div>
 <div class="list">${!sh.length?'<div class="empty">No players added yet.</div>':sh.map(p=>`<div class="row"><div class="num">${p.alt?"A":p.num}</div><div class="info">
 <button class="name" data-id="${p.id}">${esc(p.player_name)}</button>${p.alt?'<span class="red">ALTERNATE</span>':game!=="Tournament"&&p.preferred_seat?`<span>Preferred seat: ${p.preferred_seat}</span>`:""}
 ${p.notes?`<span class="note">Note: ${esc(p.notes)}</span>`:""}<span class="signupTime">Signed up ${formatSignup(p.created_at)}</span>
 ${edit==p.id?`<div class="editor"><input id="unoEntryD" value="${esc(p.notes||"")}" autocomplete="new-password"><div><button class="save" data-save="${p.id}">Save Note</button><button class="cancel" id="cancel">Cancel</button></div></div>`:""}
 </div><button class="del" data-del="${p.id}">×</button></div>`).join("")}</div></section>
 ${pendingDelete?`<div class="undoBar"><span>${esc(pendingDelete.player.player_name)} removed</span><button id="undoDelete">Undo</button></div>`:""}`;
}
function renderTodoPage(){
 const active=todos.filter(t=>!t.completed_at).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
 const completed=todos.filter(t=>t.completed_at).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at)).slice(0,25);
 return `<section class="content"><form id="todoForm" autocomplete="off"><div class="fieldwrap"><div>To-Do Item</div><textarea id="unoEntryE" maxlength="500" autocomplete="new-password"></textarea></div><button class="add todoAddButton">Add To-Do</button></form>
 ${error?`<p class="error">${esc(error)}</p>`:""}<div class="todoSectionTitle"><h2>To-Do</h2><span class="count">${countLabel(active.length,"Item","Items")}</span></div><div class="list">
 ${!active.length?'<div class="empty">Nothing currently needs to be done.</div>':active.map(t=>`<div class="todoRow"><div class="todoInfo">${String(todoEdit)===String(t.id)?`<div class="todoEditor"><textarea id="unoEntryF">${esc(t.note)}</textarea><div class="todoEditButtons"><button class="save" data-todo-save="${t.id}">Save</button><button class="cancel" id="todoEditCancel">Cancel</button></div></div>`:`<button class="todoEditable" data-todo-edit="${t.id}">${esc(t.note)}</button>`}<div class="todoTime">Entered: ${formatDateTime(t.created_at)}</div></div><button class="del" data-complete="${t.id}">×</button></div>`).join("")}</div>
 <div class="todoSectionTitle"><h2>Completed</h2><span class="count">Most recent 25</span></div><div class="list">${!completed.length?'<div class="empty">No completed items yet.</div>':completed.map(t=>`<div class="todoRow completedRow"><div class="todoInfo"><span class="completedBadge">COMPLETED</span><div class="completedText">${esc(t.note)}</div><div class="todoTime">Entered: ${formatDateTime(t.created_at)}</div><div class="todoTime">Completed: ${formatDateTime(t.completed_at)}</div></div><button class="del" data-delete-completed="${t.id}">×</button></div>`).join("")}</div></section>`;
}
function wire(){
 document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{day=b.dataset.v;render()});
 document.querySelectorAll(".game").forEach(b=>b.onclick=()=>{game=b.dataset.v;render()});
 const s=document.querySelector("#specialGameButton");if(s)s.onclick=()=>{page="special";day=null;game=null;specialEdit=false;error="";render()};
 const t=document.querySelector("#todoMenuButton");if(t)t.onclick=()=>{page="todo";error="";render()};
 wirePlayerControls();
 const b=document.querySelector("#back");if(b)b.onclick=()=>{error="";if(game)game=null;else if(day)day=null;else page="main";render()};
}
function wireSpecial(){
 const b=document.querySelector("#back");if(b)b.onclick=()=>{page="main";day=null;game=null;specialEdit=false;error="";render()};
 const s=document.querySelector("#specialSetupForm");if(s)s.onsubmit=saveSpecialSetup;
 const n=document.querySelector("#specialNameEdit");if(n)n.onclick=()=>{specialEdit=true;error="";render()};
 const f=document.querySelector("#specialEditForm");if(f)f.onsubmit=saveSpecialEdit;
 const c=document.querySelector("#cancelSpecialEdit");if(c)c.onclick=()=>{specialEdit=false;error="";render()};
 wirePlayerControls();
}
function findDirectory(name){return directory.find(x=>x.player_name.toLowerCase()===name.trim().toLowerCase())}
function rememberedSeatForGame(p){
 if(game==="Hold Em")return p.hold_em_preferred_seat??null;
 if(game==="Omaha")return p.omaha_preferred_seat??null;
 return null;
}
function applyDirectoryPlayer(p){
 const name=document.querySelector("#unoEntryA"),seat=document.querySelector("#unoEntryB"),box=document.querySelector("#nameSuggestions"),hint=document.querySelector("#seatHint");
 const remembered=rememberedSeatForGame(p);
 name.value=p.player_name;
 if(seat)seat.value=(game==="Hold Em"||game==="Omaha")?(remembered??""):"";
 if(hint){
  if(game==="Hold Em"||game==="Omaha")hint.textContent=remembered?`Remembered ${game} seat: ${remembered}`:`No ${game} preferred seat currently remembered.`;
  else hint.textContent="";
 }
 if(box)box.classList.remove("show");
}
function showSuggestions(value){
 const box=document.querySelector("#nameSuggestions");if(!box)return;
 const q=value.trim().toLowerCase();if(!q){box.classList.remove("show");box.innerHTML="";return}
 const matches=directory.filter(p=>p.player_name.toLowerCase().startsWith(q)).slice(0,8);
 box.innerHTML=matches.map(p=>{
  const remembered=rememberedSeatForGame(p);
  const detail=(game==="Hold Em"||game==="Omaha")?(remembered?`${game} preferred seat ${remembered}`:`No ${game} preferred seat`):"Previous player";
  return `<button type="button" class="suggestion" data-dir="${esc(p.player_name)}">${esc(p.player_name)}<small>${detail}</small></button>`;
 }).join("");
 box.classList.toggle("show",matches.length>0);
 box.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{const p=directory.find(x=>x.player_name===b.dataset.dir);if(p)applyDirectoryPlayer(p)});
}
function wirePlayerControls(){
 const form=document.querySelector("#form");
 if(form){
  const name=document.querySelector("#unoEntryA"),notes=document.querySelector("#unoEntryC"),alt=document.querySelector("#altmsg");
  name.oninput=()=>showSuggestions(name.value);
  name.onchange=()=>{const p=findDirectory(name.value);if(p)applyDirectoryPlayer(p)};
  notes.oninput=()=>{const rc=shown().filter(p=>!p.alt).length;alt.innerHTML=late(notes.value)||rc>=limit(game)?'<span class="red">This player will be added as an ALTERNATE.</span>':""};
  form.onsubmit=add;
 }
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
 document.querySelectorAll(".name").forEach(b=>b.onclick=()=>{edit=b.dataset.id;render()});
 const c=document.querySelector("#cancel");if(c)c.onclick=()=>{edit=null;render()};
 document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>save(b.dataset.save));
 const cl=document.querySelector("#clear");if(cl)cl.onclick=clear;
 const tl=document.querySelector("#textlist");if(tl)tl.onclick=textList;
 const u=document.querySelector("#undoDelete");if(u)u.onclick=undoPlayerDelete;
}
function wireTodo(){
 const b=document.querySelector("#back");if(b)b.onclick=()=>{page="main";todoEdit=null;error="";render()};
 const f=document.querySelector("#todoForm");if(f)f.onsubmit=addTodo;
 document.querySelectorAll("[data-complete]").forEach(b=>b.onclick=()=>completeTodo(b.dataset.complete));
 document.querySelectorAll("[data-todo-edit]").forEach(b=>b.onclick=()=>{todoEdit=b.dataset.todoEdit;render()});
 document.querySelectorAll("[data-todo-save]").forEach(b=>b.onclick=()=>saveTodoEdit(b.dataset.todoSave));
 const c=document.querySelector("#todoEditCancel");if(c)c.onclick=()=>{todoEdit=null;render()};
 document.querySelectorAll("[data-delete-completed]").forEach(b=>b.onclick=()=>deleteCompletedTodo(b.dataset.deleteCompleted));
}
function specialValues(){
 const name=document.querySelector("#specialGameName").value.trim(),v=document.querySelector("#specialSeats").value.trim();
 if(!name){error="Please enter a game name.";render();return null}
 if(!/^\d+$/.test(v)||![6,7,8,9,10].includes(+v)){error="Total Seats must be 6, 7, 8, 9 or 10.";render();return null}
 return {name,seats:+v};
}
async function saveSpecialSetup(e){e.preventDefault();const v=specialValues();if(!v)return;const r=await sb.from("special_game_settings").upsert({id:1,game_name:v.name,total_seats:v.seats,updated_at:new Date().toISOString()}).select().single();if(r.error){error="Could not save the Special Game setup.";render();return}specialSettings=r.data;day=game="Special Game";specialEdit=false;await touchList();render()}
async function saveSpecialEdit(e){
 e.preventDefault();const v=specialValues();if(!v)return;
 const r=await sb.from("special_game_settings").update({game_name:v.name,total_seats:v.seats,updated_at:new Date().toISOString()}).eq("id",1).select().single();
 if(r.error){error="Could not save the Special Game changes.";render();return}
 const ids=players.filter(p=>p.day==="Special Game"&&p.game==="Special Game"&&p.preferred_seat&&+p.preferred_seat>v.seats).map(p=>p.id);
 if(ids.length){await sb.from("signup_players").update({preferred_seat:null}).in("id",ids);players=players.map(p=>ids.includes(p.id)?{...p,preferred_seat:null}:p)}
 specialSettings=r.data;specialEdit=false;error="";await touchList();render();
}
function buildTextList(){
 const sh=shown(),reg=sh.filter(p=>!p.alt),alts=sh.filter(p=>p.alt),lines=[game==="Special Game"&&specialSettings?`Uno Club – ${specialSettings.game_name}`:`Uno Club – ${day} ${game}`,""];
 reg.forEach(p=>{let s=`${p.num}. ${p.player_name}`;if(game!=="Tournament"&&p.preferred_seat)s+=` — Preferred Seat ${p.preferred_seat}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)});
 if(alts.length){if(reg.length)lines.push("");lines.push("Alternates");alts.forEach(p=>{let s=`A. ${p.player_name}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)})}
 return lines.join("\n");
}
function textList(){if(current().length)window.location.href="sms:&body="+encodeURIComponent(buildTextList())}
async function updateDirectory(name,seat){
 const existing=findDirectory(name);
 const payload={player_name:name,updated_at:new Date().toISOString()};
 if(game==="Hold Em")payload.hold_em_preferred_seat=seat?+seat:null;
 if(game==="Omaha")payload.omaha_preferred_seat=seat?+seat:null;
 let r;
 if(existing)r=await sb.from("player_directory").update(payload).eq("player_name",existing.player_name).select().single();
 else r=await sb.from("player_directory").insert(payload).select().single();
 if(!r.error){
  directory=directory.filter(x=>x.player_name.toLowerCase()!==r.data.player_name.toLowerCase());
  directory.push(r.data);
  directory.sort((a,b)=>a.player_name.localeCompare(b.player_name));
 }
}
async function add(e){
 e.preventDefault();error="";
 const name=formatPlayerName(document.querySelector("#unoEntryA").value),notes=document.querySelector("#unoEntryC").value.trim(),se=document.querySelector("#unoEntryB"),seat=se?se.value.trim():"";
 if(!name)return;if(current().some(p=>p.player_name.toLowerCase()===name.toLowerCase())){error="That player is already on this list.";render();return}
 const rc=shown().filter(p=>!p.alt).length,alt=late(notes)||rc>=limit(game);
 if(game!=="Tournament"&&!alt&&seat){
  const max=maxPreferredSeat(game);
  if(!/^\d+$/.test(seat)||+seat<1||+seat>max){error=`Invalid response. Preferred seat must be a number from 1 to ${max}.`;render();return}
  if(current().some(p=>String(p.preferred_seat??"")===String(+seat))){error="That preferred seat is already taken. Choose another seat or leave the seat blank.";render();return}
 }
 const savedSeat=game==="Tournament"||alt?null:(seat?+seat:null);
 const r=await sb.from("signup_players").insert({day,game,player_name:name,preferred_seat:savedSeat,notes:notes||null}).select().single();
 if(r.error){error=r.code==="23505"?"That player name or preferred seat is already on this list.":r.message}
 else{
  players.push(r.data);
  if(game==="Hold Em"||game==="Omaha")await updateDirectory(name,seat);
  else if(!findDirectory(name))await updateDirectory(name,null);
  await touchList();
 }
 render();
}
async function finalizePendingDelete(){
 if(!pendingDelete)return;const p=pendingDelete.player;pendingDelete=null;if(deleteTimer){clearTimeout(deleteTimer);deleteTimer=null}
 const r=await sb.from("signup_players").delete().eq("id",p.id);
 if(r.error){players.push(p);error=r.message}else await touchList(p.day,p.game);render();
}
async function del(id){
 if(pendingDelete)await finalizePendingDelete();
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;pendingDelete={player:{...p}};players=players.filter(x=>String(x.id)!==String(id));render();deleteTimer=setTimeout(finalizePendingDelete,5000);
}
function undoPlayerDelete(){if(!pendingDelete)return;const p=pendingDelete.player;if(deleteTimer)clearTimeout(deleteTimer);deleteTimer=null;pendingDelete=null;players.push(p);render()}
async function clear(){
 if(pendingDelete)await finalizePendingDelete();const special=game==="Special Game",label=special&&specialSettings?specialSettings.game_name:`${day} ${game}`;
 if(!confirm(special?`Clear the entire ${label} list and reset Special Game?`:`Clear the entire ${label} list?`))return;
 const d=day,g=game,r=await sb.from("signup_players").delete().eq("day",d).eq("game",g);if(r.error){error=r.message;render();return}
 players=players.filter(p=>!(p.day===d&&p.game===g));await touchList(d,g);
 if(special){await sb.from("special_game_settings").delete().eq("id",1);specialSettings=null;day=game=null;page="main";specialEdit=false}render();
}
async function save(id){const note=document.querySelector("#unoEntryD").value.trim(),r=await sb.from("signup_players").update({notes:note||null}).eq("id",id).select().single();if(r.error)error=r.message;else{players=players.map(p=>String(p.id)===String(id)?r.data:p);await touchList()}edit=null;render()}
async function addTodo(e){e.preventDefault();const note=document.querySelector("#unoEntryE").value.trim();if(!note)return;const r=await sb.from("todo_items").insert({note}).select().single();if(r.error)error="Could not add the To-Do item.";else todos.push(r.data);render()}
async function saveTodoEdit(id){const note=document.querySelector("#unoEntryF").value.trim();if(!note){error="To-Do item cannot be blank.";render();return}const r=await sb.from("todo_items").update({note}).eq("id",id).is("completed_at",null).select().single();if(r.error)error="Could not save the To-Do item.";else{todos=todos.map(t=>String(t.id)===String(id)?r.data:t);todoEdit=null}render()}
async function completeTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Mark this item completed?\n\n${item.note}`))return;const r=await sb.from("todo_items").update({completed_at:new Date().toISOString()}).eq("id",id).select().single();if(r.error)error="Could not complete that item.";else todos=todos.map(t=>String(t.id)===String(id)?r.data:t);await trimCompletedTodos();render()}
async function deleteCompletedTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Permanently delete this completed item?\n\n${item.note}`))return;const r=await sb.from("todo_items").delete().eq("id",id).not("completed_at","is",null);if(r.error)error="Could not delete that completed item.";else todos=todos.filter(t=>String(t.id)!==String(id));render()}
async function trimCompletedTodos(){const c=todos.filter(t=>t.completed_at).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at));if(c.length<=25)return;const ids=c.slice(25).map(t=>t.id),r=await sb.from("todo_items").delete().in("id",ids);if(!r.error)todos=todos.filter(t=>!ids.includes(t.id))}
async function checkForUpdate(){try{const r=await fetch(window.location.pathname+"?updatecheck="+Date.now(),{cache:"no-store"}),h=await r.text(),m=h.match(/const APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION)window.location.replace(window.location.pathname+"?v="+encodeURIComponent(m[1]))}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkForUpdate()});window.addEventListener("pageshow",checkForUpdate);load();
</script>
