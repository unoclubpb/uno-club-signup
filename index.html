function arrivesAfter715(note){
 const text=String(note||"");

  let h=Number(m[1]),min=m[2]!==undefined?Number(m[2]):0,mer=(m[3]||"").replace(/[\s.]/g,"").toLowerCase(),h24=null;

  if(h24!==null && h24*60+min>19*60+15)return true;

}

async function loadTop10Players(){
 const [ap,ar]=await Promise.all([
  sb.from("list_archive_players").select("archive_id,player_id,player_name,was_alternate,was_late"),
  sb.from("list_archives").select("id,game")
 ]);
 if(ap.error||ar.error){top10Players=[];error="Could not load Top 10 Players.";return}
 const gamesById=new Map((ar.data||[]).map(a=>[String(a.id),a.game]));
 const totals=new Map();
 (ap.data||[]).forEach(p=>{
  const g=gamesById.get(String(p.archive_id));if(!g)return;
  const key=p.player_id?`id:${p.player_id}`:`name:${String(p.player_name||"").toLowerCase()}`;
  if(!totals.has(key))totals.set(key,{name:p.player_name||"",cash:0,tournaments:0,total:0});
  const t=totals.get(key);
  if(g==="Tournament")t.tournaments++;
  else if(g==="Hold Em"||g==="Omaha"||g==="Special Game")t.cash++;
  else return;
  t.total++;
 });
 top10Players=[...totals.values()].sort((a,b)=>b.total-a.total||b.cash-a.cash||b.tournaments-a.tournaments||a.name.localeCompare(b.name)).slice(0,10);
}
function renderTop10Players(){
 return `<section class="content top10Wrap">${top10Players.length?`<table class="top10Table"><thead><tr><th>Name</th><th>Cash Games</th><th>Tournaments</th></tr></thead><tbody>${top10Players.map(p=>`<tr><td><button class="top10PlayerName" data-top10-player="${esc(p.name)}">${esc(p.name)}</button></td><td>${p.cash}</td><td>${p.tournaments}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">No archived game data yet.</div>'}</section>`;
}

function unwrapRpcData(data){return Array.isArray(data)&&data.length===1&&typeof data[0]==="object"&&!Array.isArray(data[0])?data[0]:data}

function localDateISO(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function upcomingWednesdayDate(){const d=new Date();const add=(3-d.getDay()+7)%7;d.setDate(d.getDate()+add);return localDateISO(d)}
function tournamentDateLabel(value){const d=new Date(value+"T12:00:00");return d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric",year:"numeric"})}
function scheduledTournaments(){return tournamentHistory.filter(t=>!t.archived_at).sort((a,b)=>a.tournament_date.localeCompare(b.tournament_date)||Number(a.id)-Number(b.id))}
function archivedTournaments(){return tournamentHistory.filter(t=>!!t.archived_at)}
function scheduledForDate(date,isSpecial){return scheduledTournaments().find(t=>t.tournament_date===date&&t.is_special===(isSpecial===true))||null}
function selectedTournamentEdit(){return tournamentEditId?tournamentHistory.find(t=>String(t.id)===String(tournamentEditId)&&!t.archived_at)||null:null}

 const sr=await sb.from("special_game_settings").delete().eq("id",1);
 if(sr.error){
  error="The player list was removed, but the Special Game setup could not be deleted.";
  render();
  return;
 }

 players=players.filter(p=>!(p.day==="Special Game"&&p.game==="Special Game"));
 specialSettings=null;
 specialEdit=false;
 day=null;
 game=null;
 page="main";
 error="";
 render();
}

function buildTextList(){
 const sh=shown(),reg=sh.filter(p=>!p.alt&&!p.isLate),alts=sh.filter(p=>p.alt),lates=sh.filter(p=>p.isLate),lines=[game==="Special Game"&&specialSettings?`Uno Club – ${specialSettings.game_name}`:`Uno Club – ${day} ${game}`,""];
 reg.forEach(p=>{let s=`${p.num}. ${p.player_name}`;if(game!=="Tournament"&&p.preferred_seat)s+=` — Preferred Seat ${p.preferred_seat}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)});
 if(alts.length){if(reg.length)lines.push("");lines.push("Alternates");alts.forEach(p=>{let s=`A. ${p.player_name}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)})}
 if(lates.length){if(reg.length||alts.length)lines.push("");lines.push("Late Arrivals");lates.forEach(p=>{let s=`L. ${p.player_name}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)})}
 return lines.join("\n");
}
function textList(){if(current().length)window.location.href="sms:&body="+encodeURIComponent(buildTextList())}
async function updateDirectory(name,seat){
 const existing=findDirectory(name);
 const payload={player_name:name,updated_at:new Date().toISOString()};if(!existing)payload.active=true;
 if(game==="Hold Em")payload.hold_em_preferred_seat=seat?+seat:null;
 if(game==="Omaha")payload.omaha_preferred_seat=seat?+seat:null;
 let r;
 if(existing)r=await sb.from("player_directory").update(payload).eq("player_name",existing.player_name).select().single();
 else r=await sb.from("player_directory").insert(payload).select().single();
 if(!r.error){
  directory=directory.filter(x=>x.player_name.toLowerCase()!==r.data.player_name.toLowerCase());
  directory.push(r.data);
  directory.sort((a,b)=>a.player_name.localeCompare(b.player_name));
 }
}
async function add(e){
 e.preventDefault();error="";
 const name=formatPlayerName(document.querySelector("#unoEntryA").value),notes=document.querySelector("#unoEntryC").value.trim(),se=document.querySelector("#unoEntryB"),seat=se?se.value.trim():"";
 if(!name)return;
 const directoryPlayer=findDirectory(name);
 if(directoryPlayer&&directoryPlayer.active===false){error="An inactive player cannot be added to the list.";render();return}
 if(current().some(p=>p.player_name.toLowerCase()===name.toLowerCase())){error="That player is already on this list.";render();return}
 const lateArrival=isLateArrivalTime(),rc=shown().filter(p=>!p.alt&&!p.isLate).length,alt=!lateArrival&&(late(notes)||rc>=limit(game));
 if(game!=="Tournament"&&!alt&&!lateArrival&&seat){
  const max=maxPreferredSeat(game);
  if(!/^\d+$/.test(seat)||+seat<1||+seat>max){addPlayerDraft={name,seat,notes};error=`Invalid response. Preferred seat must be a number from 1 to ${max}.`;render();return}
  if(current().some(p=>String(p.preferred_seat??"")===String(+seat))){addPlayerDraft={name,seat,notes};error="That preferred seat is already taken. Choose another seat or leave the seat blank.";render();return}
 }
 const savedSeat=game==="Tournament"||alt||lateArrival?null:(seat?+seat:null);
 const r=await sb.from("signup_players").insert({day,game,player_name:name,preferred_seat:savedSeat,notes:notes||null,is_late:lateArrival,arrived:lateArrival}).select().single();
 if(r.error){error=r.code==="23505"?"That player name or preferred seat is already on this list.":r.message}
 else{
  players.push(r.data);
  if((game==="Hold Em"||game==="Omaha")&&!lateArrival)await updateDirectory(name,seat);
  else if((game==="Hold Em"||game==="Omaha")&&!findDirectory(name))await updateDirectory(name,null);
  else if(!findDirectory(name))await updateDirectory(name,null);
  await touchList();
  const addBtn=document.querySelector("#signupAddButton");
  if(addBtn){
   addBtn.textContent="Player Added";
   addBtn.classList.add("playerAddedFeedback");
   addBtn.disabled=true;
   document.querySelector("#unoEntryA").value="";
   if(document.querySelector("#unoEntryB"))document.querySelector("#unoEntryB").value="";
   document.querySelector("#unoEntryC").value="";
   setTimeout(()=>render(),2000);
   return;
  }
 }
 render();
}
async function toggleArrived(id){
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;
 if(p.is_late)return;
 const next=!(p.arrived===true);
 const r=await sb.from("signup_players").update({arrived:next,arrived_at:next?new Date().toISOString():null}).eq("id",p.id).select().single();
 if(r.error){error=r.message;render();return}
 Object.assign(p,r.data);render();
}
async function del(id){
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;
 if(!confirm(`Are you sure you want to delete ${p.player_name}?\n\nOnly delete this player if they did not show up.`))return;
 const r=await sb.from("signup_players").delete().eq("id",p.id);
 if(r.error){error=r.message;render();return}
 players=players.filter(x=>String(x.id)!==String(id));
 await touchList(p.day,p.game);
 render();
}
async function clear(){
 if(pendingDelete)await finalizePendingDelete();
 const special=game==="Special Game",label=special&&specialSettings?specialSettings.game_name:`${day} ${game}`;
 if(special&&players.filter(p=>p.day==="Special Game"&&p.game==="Special Game").length===0){await deleteSpecialGame();return}
 const nowCheck=new Date(),currentMinutes=nowCheck.getHours()*60+nowCheck.getMinutes(),dayName=nowCheck.toLocaleDateString("en-US",{weekday:"long"});
 if(!special&&(currentMinutes<20*60||dayName!==day)){error="Game cannot be archived until 8:00 PM.";render();return}
 if(!confirm(`Clear and archive this list?`))return;
 const d=day,g=game;
 if(!current().length){if(special){const sd=await sb.from("special_game_settings").delete().eq("id",1);if(!sd.error){specialSettings=null;day=game=null;page="main"}}render();return}
 const now=new Date(),dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
 const r=await sb.rpc("archive_signup_list",{p_day:d,p_game:g,p_archive_date:dateStr,p_special_name:special&&specialSettings?specialSettings.game_name:null});
 if(r.error){error="Could not archive and clear this list. "+r.error.message;render();return}
 players=players.filter(p=>!(p.day===d&&p.game===g));await touchList(d,g);
 if(g==="Tournament")await loadTournamentHistory();
 if(special){
  const sd=await sb.from("special_game_settings").delete().eq("id",1);
  if(sd.error){error="The list was archived, but the Special Game setup could not be reset.";render();return}
  specialSettings=null;day=null;game=null;page="main";specialEdit=false;
 }
 render();
}
async function save(id){
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;
 const note=document.querySelector("#unoEntryD").value.trim();
 const seatEl=document.querySelector("#unoEditSeat");
 let seat=seatEl?seatEl.value.trim():"";
 if(seatEl&&seat){
  const max=limit(p.game);
  if(!/^\d+$/.test(seat)||+seat<1||+seat>max){error=`Preferred seat must be a number from 1 to ${max}.`;render();return}
  if(players.some(x=>String(x.id)!==String(id)&&x.day===p.day&&x.game===p.game&&!x.alt&&String(x.preferred_seat??"")===String(+seat))){
   error="That preferred seat is already taken. Choose another seat or leave the seat blank.";render();return
  }
 }
 const changes={notes:note||null};
 if(seatEl)changes.preferred_seat=seat?+seat:null;
 const r=await sb.from("signup_players").update(changes).eq("id",id).select().single();
 if(r.error){error=r.message;render();return}
 players=players.map(x=>String(x.id)===String(id)?r.data:x);await touchList();edit=null;error="";render()
}
async function addTodo(e){e.preventDefault();const note=document.querySelector("#unoEntryE").value.trim();if(!note)return;const r=await sb.from("todo_items").insert({note}).select().single();if(r.error)error="Could not add the To-Do item.";else todos.push(r.data);render()}
async function saveTodoEdit(id){const note=document.querySelector("#unoEntryF").value.trim();if(!note){error="To-Do item cannot be blank.";render();return}const r=await sb.from("todo_items").update({note}).eq("id",id).is("completed_at",null).select().single();if(r.error)error="Could not save the To-Do item.";else{todos=todos.map(t=>String(t.id)===String(id)?r.data:t);todoEdit=null}render()}
async function completeTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Mark this item completed?\n\n${item.note}`))return;const r=await sb.from("todo_items").update({completed_at:new Date().toISOString()}).eq("id",id).select().single();if(r.error)error="Could not complete that item.";else todos=todos.map(t=>String(t.id)===String(id)?r.data:t);await trimCompletedTodos();render()}
async function deleteActiveTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Are you sure you want to delete this item without marking it completed?\n\n${item.note}`))return;const r=await sb.from("todo_items").delete().eq("id",id).is("completed_at",null);if(r.error)error="Could not delete that To-Do item.";else todos=todos.filter(t=>String(t.id)!==String(id));render()}
async function deleteCompletedTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Permanently delete this completed item?\n\n${item.note}`))return;const r=await sb.from("todo_items").delete().eq("id",id).not("completed_at","is",null);if(r.error)error="Could not delete that completed item.";else todos=todos.filter(t=>String(t.id)!==String(id));render()}
async function trimCompletedTodos(){const c=todos.filter(t=>t.completed_at).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at));if(c.length<=25)return;const ids=c.slice(25).map(t=>t.id),r=await sb.from("todo_items").delete().in("id",ids);if(!r.error)todos=todos.filter(t=>!ids.includes(t.id))}
async function checkForUpdate(){try{const r=await fetch(window.location.pathname+"?updatecheck="+Date.now(),{cache:"no-store"}),h=await r.text(),m=h.match(/const APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION)window.location.replace(window.location.pathname+"?v="+encodeURIComponent(m[1]))}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkForUpdate()});window.addEventListener("pageshow",checkForUpdate);load();
</script>
