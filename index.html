const games={Monday:["Hold Em","Omaha"],Wednesday:["Tournament","Omaha"],Thursday:["Hold Em","Omaha"]};

function arrivesAfter715(note){
 const text=String(note||"");
 const re=/\b(1[0-2]|[1-9])(?:\s*[:.]\s*([0-5]\d))?\s*(a\.?\s*m\.?|p\.?\s*m\.?)?\b/gi;
 let m;
 while((m=re.exec(text))!==null){
  let h=Number(m[1]),min=m[2]!==undefined?Number(m[2]):0,mer=(m[3]||"").replace(/[\s.]/g,"").toLowerCase(),h24=null;
  if(mer==="pm") h24=h===12?12:h+12;
  else if(mer==="am") h24=h===12?0:h;
  else if(h>=7&&h<=11) h24=h+12;
  if(h24!==null && h24*60+min>19*60+15)return true;
 }
 return false;
}
const late=n=>/\b(?:late|later)\b/i.test(n||"")||arrivesAfter715(n);

let day=null,game=null,page="main",players=[],todos=[],specialSettings=null,listUpdates=[],directory=[];
let edit=null,todoEdit=null,todoNewestFirst=false,specialEdit=false,error="",addPlayerDraft=null,pendingDelete=null,deleteTimer=null;

let adminMode="main",archiveGame=null,archiveViewId=null,archives=[],archivePlayers=[],archiveCounts={},archiveYear="all",archiveSort="newest",top10Players=[],attendanceTop10Only=false,tournamentTypes=[],tournamentHistory=[],tournamentEditId=null,tournamentDraft=null,tournamentReturnToAdd=false,tournamentTypeViewId=null,playerDbFromAdmin=false,playerDbFromTop10=false,playerDbFromArchive=false,playerHistoryMode=false,playerHistoryView="menu",playerHistory=[],playerHistoryRows=[],playerHistoryArchiveId=null,playerHistoryArchivePlayers=[],playerLastPlayed=null,staffMembers=[],staffDaysOff=[],staffHistoryId=null,dayOffSaved=false,dayOffEditId=null,tournamentState={rebuys_over:false,in_money:false,bust_sequence:[],chop_saved:false,chop_player_ids:[],chop_points_each:null},tournamentUndoConfirmed=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const formatPlayerName=s=>String(s||"").trim().toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase());
const limit=g=>g==="Special Game"?(specialSettings?+specialSettings.total_seats:10):g==="Hold Em"?10:g==="Omaha"?9:20;

const current=()=>players.filter(p=>p.day===day&&p.game===game);
const gameCount=(d,g)=>players.filter(p=>p.day===d&&p.game===g).length;
const attendanceFor=(d,g)=>{
 const list=players.filter(p=>p.day===d&&p.game===g);
 const arrived=list.filter(p=>p.arrived===true||p.is_late===true).length;
 return {arrived,expected:Math.max(0,list.length-arrived)};
};
const specialCount=()=>players.filter(p=>p.day==="Special Game"&&p.game==="Special Game").length;
const countLabel=(n,a,b)=>`${n} ${n===1?a:b}`;
const sortBySignup=a=>[...a].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)||(Number(x.id)||0)-(Number(y.id)||0));

function isLateArrivalTime(){
 if(day==="Special Game"||game==="Special Game")return false;
 const now=new Date(),today=now.toLocaleDateString("en-US",{weekday:"long"});
 if(today!==day)return false;
 const mins=now.getHours()*60+now.getMinutes();
 return game==="Tournament"?mins>=19*60+31:mins>=19*60+1;
}
function shown(){
 if(!game)return[];
 let n=0;
 const a=sortBySignup(current()).map(p=>{
  const isLate=p.is_late===true;
  const forced=!isLate&&late(p.notes);
  const alt=!isLate&&(forced||n>=limit(game));
  if(!alt&&!isLate)n++;
  return {...p,alt,isLate,forcedLate:forced,num:(alt||isLate)?null:n};
 });
 // Preserve the original signup order for seat/alternate numbering above,
 // but display expected players first, then arrived players, alphabetically within each group.
 return a.sort((x,y)=>{
  const arrivedX=x.arrived===true||x.isLate,arrivedY=y.arrived===true||y.isLate;
  if(arrivedX!==arrivedY)return arrivedX?1:-1;
  // Expected regular players precede expected alternates; arrivals share one alphabetical group.
  if(!arrivedX&&x.alt!==y.alt)return x.alt?1:-1;
  return currentPlayerName(x).localeCompare(currentPlayerName(y),undefined,{sensitivity:"base",numeric:true})||
   new Date(x.created_at)-new Date(y.created_at)||(Number(x.id)||0)-(Number(y.id)||0);
 });
}
function currentPlayerName(p){if(p?.player_id){const d=directory.find(x=>String(x.player_id)===String(p.player_id));if(d?.player_name)return d.player_name}return p?.player_name||""}
function formatSignup(v){return new Date(v).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function lastUpdatedFor(d=day,g=game){return listUpdates.find(x=>x.day===d&&x.game===g)?.updated_at||null}
function formatLastUpdated(v){return v?"Last updated "+formatSignup(v):"No changes yet"}
function formatDateTime(v){return v?new Date(v).toLocaleString(undefined,{month:"numeric",day:"numeric",year:"2-digit",hour:"numeric",minute:"2-digit"}):""}
async function touchList(d=day,g=game){
 if(!d||!g)return;

 if(!r.error){listUpdates=listUpdates.filter(x=>!(x.day===d&&x.game===g));listUpdates.push(r.data)}
}
async function load(){
 const [pr,tr,sr,ur,dr,thr,tsr]=await Promise.all([
  sb.from("signup_players").select("*").order("created_at").order("id"),
  sb.from("todo_items").select("*").order("created_at"),
  sb.from("special_game_settings").select("*").eq("id",1).maybeSingle(),
  sb.from("list_updates").select("*"),
  sb.from("player_directory").select("*").order("player_name"),
  sb.rpc("get_tournament_history"),
  sb.from("tournament_live_state").select("*").eq("id",1).maybeSingle()
 ]);
 if(pr.error)error="Could not load the player list.";else players=pr.data||[];
 if(tr.error)error="Could not load the To-Do list.";else todos=tr.data||[];
 if(sr.error)error="Could not load the Special Game settings.";else specialSettings=sr.data||null;
 listUpdates=ur.error?[]:(ur.data||[]);
 directory=dr.error?[]:(dr.data||[]);
 if(!thr.error)tournamentHistory=Array.isArray(thr.data)?thr.data:(thr.data?[thr.data]:[]);
 if(!tsr.error&&tsr.data)tournamentState=tsr.data;
  await loadStaffData();
 if(STAFF_MODE){page="admin";adminMode="staff"}render();
}
function renderHeader(title,subtitle=""){
 const staffSection=STAFF_MODE&&page==="admin"&&adminMode.startsWith("staff");
 const staffRoot=staffSection&&adminMode==="staff";
 return `<header class="listsBanner">${staffRoot?'<button type="button" class="hubLogoButton" id="backToHub" aria-label="Back to Uno Club Hub"><img src="./uno-club-hub-new.svg?v=5" alt="Uno Club Hub"></button>':page==="main"&&!day&&!game?'<button type="button" class="hubLogoButton" id="backToHub" aria-label="Back to Uno Club Hub"><img src="./uno-club-hub-new.svg?v=5" alt="Uno Club Hub"></button>':'<button class="back" id="back" aria-label="Back">←</button>'}<div class="headertext"><h1 class="${title==="Staff Management"?"staffManagementTitle":""}">${esc(title)}</h1>${subtitle?`<small>${esc(subtitle)}</small>`:""}</div><img class="headerlogo" id="homeLogo" src="${staffSection&&adminMode!=="staff"?"uno-club-staff-new.svg?v=5":"uno-club-lists-new.svg?v=5"}" alt="${staffSection?"Uno Club Staff":"Uno Club Lists"}"></header>`;
}

 }

 const pos=TABLE_SEAT_POSITIONS[g];if(!pos)return "";
 const max=g==="Hold Em"?10:9;
 const regular=players.filter(p=>p.day===d&&p.game===g&&!p.alt);

function renderCssTournamentTable(d){
 const pos=CSS_TABLE_POSITIONS["Hold Em"];
 let seats=`<div class="cssSeat tournamentBlankSeat" style="left:${pos.dealer[0]}%;top:${pos.dealer[1]}%"></div>`;
 for(let n=1;n<=10;n++){
  const xy=pos[n];
  seats+=`<div class="cssSeat tournamentBlankSeat" style="left:${xy[0]}%;top:${xy[1]}%"></div>`;
 }
 const attendance=attendanceFor(d,"Tournament");

 })();
 const currentRegular=scheduledTournaments().find(t=>t.is_special!==true&&t.tournament_date===currentWednesday)||null;
 const upcomingDisplayName=currentRegular?String(currentRegular.tournament_type_name||"").replace(/\s*\([^)]*\)\s*$/,"").trim():"";
 const upcomingName=upcomingDisplayName?`<div class="upcomingTournamentName">${esc(upcomingDisplayName)}</div>`:"";
 return `<div class="cssPokerTable cssTournamentTable"><div class="felt"></div>${seats}${upcomingName}<div class="tableTitle">TOURNAMENT</div>${attendance.arrived+attendance.expected>0?`<div class="tableAttendance"><span class="arrivedCount">${attendance.arrived} Arrived</span><span class="attendanceSlash"> / </span><span class="expectedCount">${attendance.expected} Expected</span></div>`:""}<div class="cssCount">${gameCount(d,"Tournament")}</div></div>`;

function renderCssPokerTable(d,g){
 const pos=CSS_TABLE_POSITIONS[g],max=g==="Hold Em"?10:9;
 const gamePlayers=sortBySignup(players.filter(p=>p.day===d&&p.game===g));
 let n=0;
 const regular=gamePlayers.filter(p=>{
  const isLate=p.is_late===true;
  const forced=!isLate&&late(p.notes);
  const alt=!isLate&&(forced||n>=limit(g));
  if(!alt&&!isLate)n++;
  return !alt&&!isLate;
 });
 const unseated=regular.filter(p=>!p.preferred_seat);
 let seats=`<div class="cssSeat dealer" style="left:${pos.dealer[0]}%;top:${pos.dealer[1]}%"><span>DEALER</span></div>`;
 for(let n=1;n<=max;n++){
  const p=regular.find(x=>String(x.preferred_seat??"")===String(n)),xy=pos[n];
  seats+=`<div class="cssSeat ${p?`occupied ${p.arrived===true?"arrivedPlayer":"expectedPlayer"}`:""}" style="left:${xy[0]}%;top:${xy[1]}%"><span>${p?esc(currentPlayerName(p)):`SEAT ${n}`}</span></div>`;
 }

}

async function undoTournamentBust(){

 const id=seq[seq.length-1],p=players.find(x=>String(x.id)===String(id));if(!p)return;

 if(remaining.length===0||remaining.every(x=>x.tournament_place)){const winner=current().find(x=>x.tournament_place===1);if(winner){const wr=await sb.from("signup_players").update({tournament_active:true,tournament_place:null}).eq("id",winner.id).select().single();if(!wr.error)players=players.map(x=>String(x.id)===String(winner.id)?wr.data:x)}}

 if(r.error){error="Could not undo that bust out.";render();return}
 players=players.map(x=>String(x.id)===String(id)?r.data:x);

}

async function loadArchives(g){
 const q=await sb.from("list_archives").select("*").eq("game",g).order("archive_date",{ascending:false}).order("archived_at",{ascending:false});
 archives=q.error?[]:(q.data||[]);
 archiveCounts={};archiveYear="all";archiveSort="newest";
 // Fetch archive-player counts in pages so lists with more than 1,000 players stay accurate.
 const ids=archives.map(a=>a.id);
 for(let i=0;i<ids.length;i+=75){
  const group=ids.slice(i,i+75);
  for(let offset=0;;offset+=1000){
   const result=await sb.from("list_archive_players").select("archive_id").in("archive_id",group).range(offset,offset+999);
   if(result.error){console.warn("Archive counts unavailable",result.error);break}
   for(const p of result.data||[])archiveCounts[String(p.archive_id)]=(archiveCounts[String(p.archive_id)]||0)+1;
   if((result.data||[]).length<1000)break;
  }
 }
}

async function loadTop10Players(){
 const [ap,ar]=await Promise.all([
  sb.from("list_archive_players").select("archive_id,player_id,player_name"),
  sb.from("list_archives").select("id,archive_date,game")
 ]);
 if(ap.error||ar.error){top10Players=[];error="Could not load Top 10 Players.";return}
 const gamesById=new Map((ar.data||[]).map(a=>[String(a.id),a]));
 const totals=new Map();
 (ap.data||[]).forEach(p=>{
  const a=gamesById.get(String(p.archive_id));if(!a||!a.archive_date)return;
  const g=a.game;
  if(!["Tournament","Hold Em","Omaha","Special Game"].includes(g))return;
  const normalizedName=String(p.player_name||"").trim().toLowerCase().replace(/\s+/g," ");
  const key=p.player_id!=null?`id:${p.player_id}`:`name:${normalizedName}`;
  if(!totals.has(key))totals.set(key,{name:p.player_name||"",player_id:p.player_id,holdem:0,omaha:0,tournaments:0,special:0,total:0,days:new Set()});
  const t=totals.get(key);
  if(g==="Tournament")t.tournaments++;
  else if(g==="Hold Em")t.holdem++;
  else if(g==="Omaha")t.omaha++;
  else t.special++;
  t.days.add(a.archive_date);
 });
 top10Players=[...totals.values()].map(t=>({...t,total:t.days.size,days:undefined,name:(directory.find(d=>t.player_id!=null&&String(d.player_id)===String(t.player_id))||{}).player_name||t.name}))

}

  if(addPlayerDraft){name.value=addPlayerDraft.name||"";if(seatInput)seatInput.value=addPlayerDraft.seat||"";if(notes)notes.value=addPlayerDraft.notes||"";addPlayerDraft=null;}
  name.oninput=()=>showSuggestions(name.value);
  name.onchange=()=>{const p=findDirectory(name.value);if(p)applyDirectoryPlayer(p)};
  notes.oninput=()=>{const rc=shown().filter(p=>!p.alt).length;alt.innerHTML=late(notes.value)||rc>=limit(game)?'<span class="red">This player will be added as an ALTERNATE.</span>':""};
  form.onsubmit=add;
 }
 document.querySelectorAll("[data-arrived]").forEach(b=>b.onclick=()=>toggleArrived(b.dataset.arrived));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
 document.querySelectorAll(".name").forEach(b=>b.onclick=()=>{edit=b.dataset.id;render()});
 const c=document.querySelector("#cancel");if(c)c.onclick=()=>{edit=null;render()};
 document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>save(b.dataset.save));
 const cl=document.querySelector("#clear");if(cl)cl.onclick=clear;
 const tl=document.querySelector("#textlist");if(tl)tl.onclick=textList;
}
function wireTodo(){
 wireHomeLogo();
 const identity=document.querySelector("#todoIdentityForm");if(identity)identity.onsubmit=e=>{e.preventDefault();const name=document.querySelector("#todoIdentityName").value.trim();if(!name){error="Please enter your name.";render();return}try{localStorage.setItem("unoClubTodoUser",name)}catch(err){error="Your browser could not save your name. Please enable site storage.";render();return}error="";render()};
 const b=document.querySelector("#back");if(b)b.onclick=()=>{page="main";todoEdit=null;error="";render()};
 const f=document.querySelector("#todoForm");if(f)f.onsubmit=addTodo;
 const sort=document.querySelector("#todoSortToggle");if(sort)sort.onclick=()=>{todoNewestFirst=!todoNewestFirst;render()};
 document.querySelectorAll("[data-complete]").forEach(b=>b.onclick=()=>completeTodo(b.dataset.complete));
 document.querySelectorAll("[data-delete-active]").forEach(b=>b.onclick=()=>deleteActiveTodo(b.dataset.deleteActive));
 document.querySelectorAll("[data-todo-edit]").forEach(b=>b.onclick=()=>{todoEdit=b.dataset.todoEdit;render()});
 document.querySelectorAll("[data-todo-save]").forEach(b=>b.onclick=()=>saveTodoEdit(b.dataset.todoSave));
 const c=document.querySelector("#todoEditCancel");if(c)c.onclick=()=>{todoEdit=null;render()};
 document.querySelectorAll("[data-delete-completed]").forEach(b=>b.onclick=()=>deleteCompletedTodo(b.dataset.deleteCompleted));
}
function specialValues(){
 const name=document.querySelector("#specialGameName").value.trim(),v=document.querySelector("#specialSeats").value.trim(),date=document.querySelector("#specialGameDate").value;
 if(!name){error="Please enter a game name.";render();return null}
 if(!/^\d+$/.test(v)||![6,7,8,9,10].includes(+v)){error="Total Seats must be 6, 7, 8, 9 or 10.";render();return null}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+"T12:00:00").getTime())){error="Please select a valid game date.";render();return null}
 return {name,seats:+v,date};
}
async function saveSpecialSetup(e){e.preventDefault();const v=specialValues();if(!v)return;const r=await sb.from("special_game_settings").upsert({id:1,game_name:v.name,total_seats:v.seats,game_date:v.date,updated_at:new Date().toISOString()}).select().single();if(r.error){error="Could not save the Special Game setup.";render();return}specialSettings=r.data;day=game="Special Game";specialEdit=false;await touchList();render()}
async function saveSpecialEdit(e){
 e.preventDefault();const v=specialValues();if(!v)return;
 const r=await sb.from("special_game_settings").update({game_name:v.name,total_seats:v.seats,game_date:v.date,updated_at:new Date().toISOString()}).eq("id",1).select().single();
 if(r.error){error="Could not save the Special Game changes.";render();return}
 const ids=players.filter(p=>p.day==="Special Game"&&p.game==="Special Game"&&p.preferred_seat&&+p.preferred_seat>v.seats).map(p=>p.id);
 if(ids.length){await sb.from("signup_players").update({preferred_seat:null}).in("id",ids);players=players.map(p=>ids.includes(p.id)?{...p,preferred_seat:null}:p)}
 specialSettings=r.data;specialEdit=false;error="";await touchList();render();
}
async function deleteSpecialGame(){
 if(!specialSettings)return;
 if(!confirm(`Delete ${specialSettings.game_name}?`))return;

 const pr=await sb.from("signup_players").delete().eq("day","Special Game").eq("game","Special Game");
 if(pr.error){
  error="Could not delete the Special Game player list.";
  render();
  return;
 }

 const sr=await sb.from("special_game_settings").delete().eq("id",1);
 if(sr.error){
  error="The player list was removed, but the Special Game setup could not be deleted.";
  render();
  return;
 }

 players=players.filter(p=>!(p.day==="Special Game"&&p.game==="Special Game"));
 specialSettings=null;
 specialEdit=false;
 day=null;
 game=null;
 page="main";
 error="";
 render();
}

function buildTextList(){
 const sh=shown(),reg=sh.filter(p=>!p.alt&&!p.isLate),alts=sh.filter(p=>p.alt),lates=sh.filter(p=>p.isLate),lines=[game==="Special Game"&&specialSettings?`Uno Club – ${specialSettings.game_name}`:`Uno Club – ${day} ${game}`,""];
 reg.forEach(p=>{let s=`${p.num}. ${p.player_name}`;if(game!=="Tournament"&&p.preferred_seat)s+=` — Preferred Seat ${p.preferred_seat}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)});
 if(alts.length){if(reg.length)lines.push("");lines.push("Alternates");alts.forEach(p=>{let s=`A. ${p.player_name}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)})}
 if(lates.length){if(reg.length||alts.length)lines.push("");lines.push("Late Arrivals");lates.forEach(p=>{let s=`L. ${p.player_name}`;if(p.notes)s+=` — Note: ${p.notes}`;lines.push(s)})}
 return lines.join("\n");
}
function textList(){if(current().length)window.location.href="sms:&body="+encodeURIComponent(buildTextList())}
async function updateDirectory(name,seat){
 const existing=findDirectory(name);
 const payload={player_name:name,updated_at:new Date().toISOString()};if(!existing)payload.active=true;
 if(game==="Hold Em")payload.hold_em_preferred_seat=seat?+seat:null;
 if(game==="Omaha")payload.omaha_preferred_seat=seat?+seat:null;
 let r;
 if(existing)r=await sb.from("player_directory").update(payload).eq("player_id",existing.player_id).select().single();
 else r=await sb.from("player_directory").insert(payload).select().single();
 if(!r.error){
  directory=directory.filter(x=>x.player_name.toLowerCase()!==r.data.player_name.toLowerCase());
  directory.push(r.data);
  directory.sort((a,b)=>a.player_name.localeCompare(b.player_name));
 }
}
async function add(e){
 e.preventDefault();error="";
 const name=formatPlayerName(document.querySelector("#unoEntryA").value),notes=document.querySelector("#unoEntryC").value.trim(),se=document.querySelector("#unoEntryB"),seat=se?se.value.trim():"";
 if(!name)return;
 const directoryPlayer=findDirectory(name);
 if(directoryPlayer&&directoryPlayer.active===false){error="An inactive player cannot be added to the list.";render();return}
 if(current().some(p=>directoryPlayer?.player_id!=null&&p.player_id!=null?String(p.player_id)===String(directoryPlayer.player_id):p.player_name.toLowerCase()===name.toLowerCase())){error="That player is already on this list.";render();return}
 const lateArrival=isLateArrivalTime(),rc=shown().filter(p=>!p.alt&&!p.isLate).length,alt=!lateArrival&&(late(notes)||rc>=limit(game));
 if(game!=="Tournament"&&!alt&&!lateArrival&&seat){
  const max=maxPreferredSeat(game);
  if(!/^\d+$/.test(seat)||+seat<1||+seat>max){addPlayerDraft={name,seat,notes};error=`Invalid response. Preferred seat must be a number from 1 to ${max}.`;render();return}
  if(current().some(p=>String(p.preferred_seat??"")===String(+seat))){addPlayerDraft={name,seat,notes};error="That preferred seat is already taken. Choose another seat or leave the seat blank.";render();return}
 }
 const savedSeat=game==="Tournament"||alt||lateArrival?null:(seat?+seat:null);
 let linkedPlayer=directoryPlayer;
  if(!linkedPlayer){
   await updateDirectory(name,game==="Hold Em"||game==="Omaha"?seat:null);
   linkedPlayer=findDirectory(name);
  }
  const r=await sb.from("signup_players").insert({day,game,player_id:linkedPlayer?.player_id||null,player_name:name,preferred_seat:savedSeat,notes:notes||null,is_late:lateArrival,arrived:lateArrival,arrived_at:lateArrival?new Date().toISOString():null}).select().single();
 if(r.error){error=r.code==="23505"?"That player name or preferred seat is already on this list.":r.message}
 else{
  players.push(r.data);
  if(linkedPlayer&&(game==="Hold Em"||game==="Omaha")&&!lateArrival)await updateDirectory(name,seat);
  await touchList();
  const addBtn=document.querySelector("#signupAddButton");
  if(addBtn){
   addBtn.textContent="Player Added";
   addBtn.classList.add("playerAddedFeedback");
   addBtn.disabled=true;
   document.querySelector("#unoEntryA").value="";
   if(document.querySelector("#unoEntryB"))document.querySelector("#unoEntryB").value="";
   document.querySelector("#unoEntryC").value="";
   setTimeout(()=>render(),2000);
   return;
  }
 }
 render();
}
async function toggleArrived(id){
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;
 if(p.is_late)return;
 const next=!(p.arrived===true);
 const r=await sb.from("signup_players").update({arrived:next,arrived_at:next?new Date().toISOString():null}).eq("id",p.id).select().single();
 if(r.error){error=r.message;render();return}
 Object.assign(p,r.data);render();
}
async function del(id){
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;
 if(!confirm(`Are you sure you want to delete ${p.player_name}?\n\nOnly delete this player if they did not show up.`))return;
 const r=await sb.from("signup_players").delete().eq("id",p.id);
 if(r.error){error=r.message;render();return}
 players=players.filter(x=>String(x.id)!==String(id));
 await touchList(p.day,p.game);
 render();
}
async function clear(){
 if(pendingDelete)await finalizePendingDelete();
 const special=game==="Special Game",label=special&&specialSettings?specialSettings.game_name:`${day} ${game}`;
 if(special&&players.filter(p=>p.day==="Special Game"&&p.game==="Special Game").length===0){await deleteSpecialGame();return}
 const nowCheck=new Date(),currentMinutes=nowCheck.getHours()*60+nowCheck.getMinutes(),dayName=nowCheck.toLocaleDateString("en-US",{weekday:"long"});
 if(!special&&(currentMinutes<20*60||dayName!==day)){error="Game cannot be archived until 8:00 PM.";render();return}
 if(!confirm(`Clear and archive this list?`))return;
 const d=day,g=game;
 if(!current().length){if(special){const sd=await sb.from("special_game_settings").delete().eq("id",1);if(!sd.error){specialSettings=null;day=game=null;page="main"}}render();return}
 const now=new Date(),dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
 const r=await sb.rpc("archive_signup_list",{p_day:d,p_game:g,p_archive_date:dateStr,p_special_name:special&&specialSettings?specialSettings.game_name:null});
 if(r.error){error="Could not archive and clear this list. "+r.error.message;render();return}
 players=players.filter(p=>!(p.day===d&&p.game===g));await touchList(d,g);
 if(g==="Tournament")await loadTournamentHistory();
 if(special){
  const sd=await sb.from("special_game_settings").delete().eq("id",1);
  if(sd.error){error="The list was archived, but the Special Game setup could not be reset.";render();return}
  specialSettings=null;day=null;game=null;page="main";specialEdit=false;
 }
 render();
}
async function save(id){
 const p=players.find(x=>String(x.id)===String(id));if(!p)return;
 const note=document.querySelector("#unoEntryD").value.trim();
 const seatEl=document.querySelector("#unoEditSeat");
 let seat=seatEl?seatEl.value.trim():"";
 if(seatEl&&seat){
  const max=limit(p.game);
  if(!/^\d+$/.test(seat)||+seat<1||+seat>max){error=`Preferred seat must be a number from 1 to ${max}.`;render();return}
  if(players.some(x=>String(x.id)!==String(id)&&x.day===p.day&&x.game===p.game&&!x.alt&&String(x.preferred_seat??"")===String(+seat))){
   error="That preferred seat is already taken. Choose another seat or leave the seat blank.";render();return
  }
 }
 const changes={notes:note||null};
 if(seatEl)changes.preferred_seat=seat?+seat:null;
 const r=await sb.from("signup_players").update(changes).eq("id",id).select().single();
 if(r.error){error=r.message;render();return}
 players=players.map(x=>String(x.id)===String(id)?r.data:x);await touchList();edit=null;error="";render()
}
async function addTodo(e){e.preventDefault();const note=document.querySelector("#unoEntryE").value.trim();if(!note)return;const enteredBy=getTodoUser();if(!enteredBy){error="Please enter your name first.";render();return}const r=await sb.from("todo_items").insert({note,entered_by:enteredBy}).select().single();if(r.error)error="Could not add the To-Do item.";else todos.push(r.data);render()}
async function saveTodoEdit(id){const note=document.querySelector("#unoEntryF").value.trim();if(!note){error="To-Do item cannot be blank.";render();return}const r=await sb.from("todo_items").update({note}).eq("id",id).is("completed_at",null).select().single();if(r.error)error="Could not save the To-Do item.";else{todos=todos.map(t=>String(t.id)===String(id)?r.data:t);todoEdit=null}render()}
async function completeTodo(id){const item=todos.find(t=>String(t.id)===String(id));const completedBy=getTodoUser();if(!completedBy){error="Please enter your name first.";render();return}if(!item||!confirm(`Mark this item completed?\n\n${item.note}`))return;const r=await sb.from("todo_items").update({completed_at:new Date().toISOString(),completed_by:completedBy}).eq("id",id).select().single();if(r.error)error="Could not complete that item.";else todos=todos.map(t=>String(t.id)===String(id)?r.data:t);await trimCompletedTodos();render()}
async function deleteActiveTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Are you sure you want to delete this item without marking it completed?\n\n${item.note}`))return;const r=await sb.from("todo_items").delete().eq("id",id).is("completed_at",null);if(r.error)error="Could not delete that To-Do item.";else todos=todos.filter(t=>String(t.id)!==String(id));render()}
async function deleteCompletedTodo(id){const item=todos.find(t=>String(t.id)===String(id));if(!item||!confirm(`Permanently delete this completed item?\n\n${item.note}`))return;const r=await sb.from("todo_items").delete().eq("id",id).not("completed_at","is",null);if(r.error)error="Could not delete that completed item.";else todos=todos.filter(t=>String(t.id)!==String(id));render()}
async function trimCompletedTodos(){const c=todos.filter(t=>t.completed_at).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at));if(c.length<=25)return;const ids=c.slice(25).map(t=>t.id),r=await sb.from("todo_items").delete().in("id",ids);if(!r.error)todos=todos.filter(t=>!ids.includes(t.id))}
async function checkForUpdate(){try{const r=await fetch(window.location.pathname+"?updatecheck="+Date.now(),{cache:"no-store"}),h=await r.text(),m=h.match(/const APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION)window.location.replace(window.location.pathname+"?v="+encodeURIComponent(m[1]))}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkForUpdate()});window.addEventListener("pageshow",checkForUpdate);load().catch(e=>{console.error("Uno Club startup error",e);document.querySelector("#app").innerHTML='<div style="padding:24px;font-family:Arial,sans-serif"><h2>Unable to load Uno Club Lists</h2><p>Please try refreshing the page.</p><small>'+String(e?.message||e).replace(/[<>&]/g,"")+"</small></div>"});
</script>
